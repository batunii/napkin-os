name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Core library + CLI only — the Tauri app's Rust needs GTK/WebKit system
      # deps, so it is built in the `desktop` job below rather than here.
      - name: Format
        run: cargo fmt -p clan-sdk -p clan-cli -- --check

      # Clippy reports lints but does not block the build (no `-D warnings`)
      # while pre-existing lint debt is paid down. Tighten later by adding
      # `-- -D warnings` once the backlog is clear.
      - name: Clippy
        run: cargo clippy -p clan-sdk -p clan-cli --all-targets

      - name: Test
        run: cargo test -p clan-sdk -p clan-cli --all-targets

  frontend:
    name: Frontend — lint · tsc · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this covers the
      # TypeScript type-check gate as well as the production build.
      - name: Type-check & build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Packaging gate. Nothing else in CI compiles app/src-tauri or goes anywhere
  # near tauri-action, so before this job every packaging break reached us only
  # at release time, after a tag was already public. v1.2.0 shipped with no
  # desktop bundles at all because app/package.json had no `tauri` script and
  # tauri-action runs `npm run tauri build` — a one-line fault the release
  # surfaced and CI could not.
  #
  # Runs the Linux release path minus the slow parts: the real `npm run tauri
  # build` entry point, beforeBuildCommand, the clan-app compile, and a .deb
  # bundle. AppImage is skipped (~80 MB and a linuxdeploy download); macOS and
  # Windows bundling stay release-only, since they need their own runners.
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop — tauri build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same set the release workflow installs; WebKitGTK is what app/src-tauri
      # needs to compile at all.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-app

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # tauri.linux.conf.json maps binaries/clan -> /usr/bin/clan via deb.files,
      # so bundling fails with `"binaries/clan" does not exist` unless the CLI is
      # staged first — exactly as the release workflow does it.
      - name: Stage CLI into Linux packages
        run: |
          cargo build -p clan-cli --release
          mkdir -p app/src-tauri/binaries
          cp target/release/clan app/src-tauri/binaries/clan

      # Invoked the way tauri-action invokes it, so a missing or renamed script
      # fails here rather than in a release.
      - name: Build app + bundle .deb
        working-directory: app
        run: npm run tauri -- build --bundles deb

  conformance:
    name: CLI conformance harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build clan CLI (release)
        run: cargo build -p clan-cli --release

      # Deterministic black-box assertions against the built binary.
      # Exits non-zero on the number of hard failures.
      - name: Run conformance harness
        run: node test-sandbox/pipeline/conformance.mjs --clan "${{ github.workspace }}/target/release/clan"

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance.json
          if-no-files-found: warn
