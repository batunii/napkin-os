[project]
name = "napkin-server"
version = "0.1.0"
description = "The Napkin middleware: napkin.middleware/1 over FastAPI (foundation decision P2)."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # [bedrock]: botocore, for SigV4 signing on NAPKIN_MODEL_API=bedrock
    "anthropic[bedrock]>=1.8",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "typesafe-sdk==0.7.1",
    # category seeding (napkin/seed): the layers database, and PDF sources
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
