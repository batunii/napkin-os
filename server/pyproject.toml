[project]
name = "napkin-server"
version = "0.1.0"
description = "The Napkin middleware: napkin.middleware/1 over FastAPI (foundation decision P2)."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.60",
    "httpx>=0.27",
    "jsonschema>=4.22",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
