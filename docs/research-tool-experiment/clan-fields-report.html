<title>Clan Fields Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --ink:#14161B; --ink2:#4A4F5C; --ink3:#737987;
  --paper:#FFFFFF; --soft:#F5F6F8; --line:#D6DAE2; --line-soft:#E7E9EE;
  --create:#FF4F2E; --create-soft:#FFF1EE; --create-ink:#B8321A;
  --green:#22C55E; --green-soft:#DCFCE7; --green-ink:#146C35;
  --amber:#F5A524; --amber-soft:#FEF3DC; --amber-ink:#8A5A00;
  --iris:#7D52F4; --iris-soft:#F1ECFE; --iris-ink:#5A33C9;
  --cobalt:#2F64F5; --chart:#2F64F5; --chart-2:#9DB5F8; --chart-grid:#E7E9EE;
  --frost:rgba(255,255,255,.86);
  --plan:#14161B; --plan-fg:#FFFFFF; --plan-eye:#FFFFFF;
  --shadow:0 1px 2px rgba(20,32,64,.06),0 8px 24px rgba(40,64,120,.07);
  --shadow-lg:0 2px 6px rgba(20,32,64,.08),0 24px 60px rgba(40,64,120,.18);
  --ease:cubic-bezier(.2,.8,.2,1);
  --f:"Geist","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ink:#F2F3F5; --ink2:#B6BBC6; --ink3:#8E94A1;
    --paper:#0E1014; --soft:#171A20; --line:#2D323C; --line-soft:#22262E;
    --create:#FF5A3A; --create-soft:#2A1612; --create-ink:#FF8A70;
    --green-soft:#10281A; --green-ink:#6EE7A0;
    --amber-soft:#2A2110; --amber-ink:#F7C361;
    --iris:#9B7BF7; --iris-soft:#1E1830; --iris-ink:#C4B0FB;
    --chart:#6F93F8; --chart-2:#2E4378; --chart-grid:#22262E;
    --frost:rgba(14,16,20,.84);
    --plan:#F2F3F5; --plan-fg:#0F1114; --plan-eye:#0F1114;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#F2F3F5; --ink2:#B6BBC6; --ink3:#8E94A1;
  --paper:#0E1014; --soft:#171A20; --line:#2D323C; --line-soft:#22262E;
  --create:#FF5A3A; --create-soft:#2A1612; --create-ink:#FF8A70;
  --green-soft:#10281A; --green-ink:#6EE7A0;
  --amber-soft:#2A2110; --amber-ink:#F7C361;
  --iris:#9B7BF7; --iris-soft:#1E1830; --iris-ink:#C4B0FB;
  --chart:#6F93F8; --chart-2:#2E4378; --chart-grid:#22262E;
  --frost:rgba(14,16,20,.84);
  --plan:#F2F3F5; --plan-fg:#0F1114; --plan-eye:#0F1114;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--soft);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--create);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
h1,h2,h3{text-wrap:balance;margin:0}

/* ── prototype strip (not product) ─────────────────────────────────── */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;background:var(--iris-soft);color:var(--iris-ink);font-size:12.5px;border-bottom:1px solid var(--line)}
.proto b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.proto .note{flex:1 1 260px;min-width:0}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--iris) 40%,transparent);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:none;padding:3px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--iris);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink2)}
.chk input{accent-color:var(--iris)}
.linkbtn{border:0;background:none;color:var(--iris-ink);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}

/* ── OS shell bar ──────────────────────────────────────────────────── */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--frost);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--ink) 0 25%,var(--create) 0 50%,var(--ink) 0 75%,var(--line) 0)}
.shell .doc{min-width:0;flex:1;display:flex;gap:8px;align-items:baseline;overflow:hidden}
.shell .doc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shell .doc .app{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.shell .doc .t{font-weight:600;font-size:13.5px}

/* ── needs-you tray (OS, computed over the data) ───────────────────── */
.tray{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--shellh,45px));z-index:19;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.tray-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tray .who{display:flex;align-items:center;gap:10px;min-width:0}
.tray .who .agent-figure{width:30px;height:40px}
.tray .count{font-weight:700;font-size:14.5px;white-space:nowrap}
.tray .count.zero{color:var(--green-ink)}
.tray .items{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 300px;min-width:0}
.titem{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;cursor:pointer;max-width:100%}
.titem:hover{border-color:var(--create)}
.titem .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--create-ink)}
.titem .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.titem .off{font-size:11px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--create-ink);border-color:color-mix(in srgb,var(--create) 45%,var(--line))}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .n{font-family:var(--mono);font-size:11px;background:var(--create);color:#fff;border-radius:999px;padding:0 6px}
.lockstate{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green-ink)}

/* ── working mode ──────────────────────────────────────────────────── */
.work{max-width:880px;margin:0 auto;padding-block:40px 80px;padding-inline:16px;display:grid;gap:28px}
.work .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.work h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stage{display:grid;justify-items:center;gap:6px;text-align:center;padding:14px 6px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--line-soft)}
.stage .agent-figure{width:36px;height:48px}
.stage .l{font-size:12.5px;font-weight:600;line-height:1.25}
.stage .s{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.stage.done .s{color:var(--green-ink)}
.stage.now{border-color:var(--ink);box-shadow:var(--shadow)}
.stage.next{opacity:.5}
.lenses{background:var(--paper);border:1px solid var(--line-soft);border-radius:16px;padding:18px;display:grid;gap:14px}
.lenses h2{font-size:15px;font-weight:700}
.lensgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lens{display:flex;gap:8px;align-items:center;font-size:12.5px;line-height:1.3}
.lens .agent-figure{width:26px;height:35px}
.lens .st{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.lens.done .st{color:var(--green-ink)}
.live{font-family:var(--mono);font-size:12.5px;color:var(--ink2);padding:10px 12px;background:var(--soft);border-radius:10px;overflow-wrap:anywhere}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px;vertical-align:1px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.tallies{display:flex;flex-wrap:wrap;gap:24px}
.tally b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tally span{font-size:12.5px;color:var(--ink2)}
.ask{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--create-soft);border:1px solid color-mix(in srgb,var(--create) 35%,transparent);border-radius:16px;padding:18px}
.ask .agent-figure{width:40px;height:54px}
.ask .from{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--create-ink)}
.ask p{margin:4px 0 12px;font-size:16px;font-weight:600;line-height:1.4}
.ask .why{font-size:13px;color:var(--ink2);font-weight:400;margin-top:-6px}
.ask .opts{display:flex;flex-wrap:wrap;gap:8px}
.ask input[type=text]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;color:var(--ink)}
.answered{font-size:13.5px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.later{font-size:13.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:18px}

/* ── the report canvas ─────────────────────────────────────────────── */
.canvas{max-width:1120px;margin:0 auto;padding-block:28px 96px;padding-inline:16px}
.page{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.locked-banner{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--green-soft);color:var(--green-ink);font-size:13px;font-weight:500}

/* agent-authored layout classes: the agent's own vocabulary for looks */
.ed-head{padding:48px clamp(20px,5vw,64px) 36px;display:grid;gap:14px;border-bottom:1px solid var(--line-soft)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.ed-head h1{font-size:clamp(30px,5.2vw,56px);line-height:1.02;font-weight:800;letter-spacing:-.035em;max-width:17ch}
.ed-head .dek{font-size:17px;color:var(--ink2);max-width:60ch;margin:0}
.hero-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line-soft)}
.hero-nums > *{padding:26px clamp(20px,3vw,36px)}
.hero-nums > * + *{border-left:1px solid var(--line-soft)}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);padding:40px clamp(20px,5vw,64px)}
.prose{display:grid;gap:14px;align-content:start}
.prose h2,.band h2,.block h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.prose p{margin:0;max-width:62ch;font-size:16px}
.figure{display:grid;gap:10px;align-content:start}
.figure .cap{font-size:12.5px;color:var(--ink3)}
.band{padding:44px clamp(20px,5vw,64px);background:var(--plan);color:var(--plan-fg);--ink:var(--plan-fg);--ink2:color-mix(in srgb,var(--plan-fg) 72%,transparent);--ink3:color-mix(in srgb,var(--plan-fg) 55%,transparent);--line:color-mix(in srgb,var(--plan-fg) 22%,transparent);--line-soft:color-mix(in srgb,var(--plan-fg) 14%,transparent);--paper:var(--plan);--chart-grid:color-mix(in srgb,var(--plan-fg) 14%,transparent)}
.block{padding:40px clamp(20px,5vw,64px);display:grid;gap:18px;border-top:1px solid var(--line-soft)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,4vw,48px);align-items:start}
.confbox{border:1px dashed var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--ink) 3%,transparent) 10px 11px)}
.confbox .lbl{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.pair{display:flex;flex-wrap:wrap;gap:28px}
.sources{padding:32px clamp(20px,5vw,64px) 40px;border-top:1px solid var(--line-soft);display:grid;gap:12px;background:var(--soft)}
.sources h2{font-size:14px;font-weight:700}
.sources ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}

/* briefing layout */
.br-head{padding:32px clamp(20px,4vw,44px) 24px;display:grid;gap:8px;border-bottom:2px solid var(--ink)}
.br-head h1{font-size:clamp(24px,3.4vw,32px);font-weight:800;letter-spacing:-.025em;line-height:1.12;max-width:30ch}
.br-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.br-grid > section{padding:24px clamp(20px,4vw,44px);display:grid;gap:12px;align-content:start}
.br-grid > section + section{border-left:1px solid var(--line-soft)}
.br-grid h2,.br-full h2{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.br-full{padding:24px clamp(20px,4vw,44px);border-top:1px solid var(--line-soft);display:grid;gap:12px}
.kt{width:100%;border-collapse:collapse;font-size:14px}
.kt td{padding:9px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.kt td:first-child{color:var(--ink2);padding-right:12px}
.kt td:last-child{text-align:right}
.means{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:m}
.means li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:15px}
.means li::before{counter-increment:m;content:counter(m);font-family:var(--mono);font-size:12px;color:var(--ink3);padding-top:2px}

/* ── clan-* components (OS) ───────────────────────────────────────── */
clan-field,clan-chart,clan-quote,clan-gap,clan-source{display:contents}
clan-field[as="big"],clan-field[as="stat"]{display:block}
.cf{all:unset;cursor:pointer;border-radius:6px;transition:background .15s var(--ease)}
.cf:focus-visible{outline:2px solid var(--create);outline-offset:2px}
.cf:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.cf-src{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--ink3);white-space:nowrap}
.cf-src::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px;opacity:.7}
/* inline */
.cf.in{display:inline;padding:0 2px;font-weight:600;font-variant-numeric:tabular-nums;border-bottom:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.cf.in .cf-src{font-weight:400;margin-left:4px}
/* big */
.cf.big{display:grid;gap:4px;padding:6px;margin:-6px}
.cf.big .v{font-size:clamp(34px,5vw,54px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.cf.big .c{font-size:13.5px;color:var(--ink2);line-height:1.35}
/* stat: mid size */
.cf.stat{display:grid;gap:2px;padding:6px;margin:-6px}
.cf.stat .v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.cf.stat .c{font-size:13px;color:var(--ink2)}
/* cell */
.cf.cell{display:inline-grid;justify-items:end;gap:0;padding:2px 4px;margin:-2px -4px}
.cf.cell .v{font-weight:700;font-variant-numeric:tabular-nums}
/* claim (a finding in prose) */
.cf.claim{display:inline;padding:1px 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* states */
.cf .tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:1px 7px;vertical-align:2px;white-space:nowrap;font-weight:500}
.cf.s-check.claim{background:var(--create-soft);border-bottom:1.5px dashed var(--create)}
.cf.s-check .tag{background:var(--create);color:#fff}
.cf.s-check.big .v,.cf.s-check.stat .v{text-decoration:underline dashed var(--create) 2px;text-underline-offset:6px}
.cf.s-verified .tag{background:var(--green-soft);color:var(--green-ink)}
.cf.s-rejected{text-decoration:line-through;text-decoration-color:var(--create);color:var(--ink3)}
.cf.s-rejected .tag{background:var(--create-soft);color:var(--create-ink);text-decoration:none}
.cf.s-contest .split-v{display:inline-flex;align-items:baseline;gap:6px}
.cf.s-contest .split-v s{text-decoration:none;opacity:.55}
.cf.s-contest .tag{background:var(--create);color:#fff}
.cf.s-contest.in{border-bottom:1.5px dashed var(--create)}
.cf.s-rechecking .cf-src{color:var(--cobalt)}
.lock{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;flex:none}
.cf.conf.in,.cf.conf.claim{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink) 7%,transparent) 5px 6px)}
/* chart */
.cchart{all:unset;display:block;width:100%}
.cchart svg{display:block;width:100%;height:auto;overflow:visible}
.cchart .mark{cursor:pointer}
.cchart .mark:hover rect,.cchart .mark:hover circle{filter:brightness(1.15)}
.cchart .mark:focus-visible{outline:none}
.cchart .mark:focus-visible rect,.cchart .mark:focus-visible circle{stroke:var(--create);stroke-width:2}
.cchart .foot{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:6px}
/* quote */
.cq{all:unset;cursor:pointer;display:grid;gap:14px;border-radius:8px}
.cq blockquote{margin:0;font-size:clamp(22px,3.2vw,34px);line-height:1.2;font-weight:700;letter-spacing:-.02em;max-width:28ch;text-wrap:balance}
.cq blockquote::before{content:"“"}
.cq blockquote::after{content:"”"}
.cq .by{font-size:13px;color:var(--ink2)}
/* gap */
.cg{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px dashed var(--line);border-radius:14px;padding:14px 16px}
.cg .ic{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--ink3);display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--ink3)}
.cg b{display:block;font-size:14.5px}
.cg span{font-size:13px;color:var(--ink2)}
/* source line */
.cs{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:6px 8px;margin:0 -8px;border-radius:8px;font-size:13.5px}
.cs:hover{background:var(--paper)}
.cs .id{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.cs .m{font-size:12px;color:var(--ink3);white-space:nowrap}
.cs .t{min-width:0}
.cs .t small{color:var(--ink2);font-size:12.5px}

/* show components */
.show-comp [data-tag]{position:relative;outline:1.5px dashed var(--iris);outline-offset:3px;border-radius:4px}
.show-comp clan-field[as="inline"] [data-tag],.show-comp clan-field[as="claim"] [data-tag]{outline-offset:1px}
.show-comp [data-tag]::after{content:attr(data-tag);position:absolute;left:-2px;top:-17px;font-family:var(--mono);font-size:9.5px;line-height:1;font-weight:500;letter-spacing:0;text-transform:none;color:#fff;background:var(--iris);padding:2px 5px;border-radius:3px;white-space:nowrap;pointer-events:none;z-index:2;text-decoration:none}
.show-comp .cf.in::after,.show-comp .cf.claim::after{display:none}

/* ── the evidence drawer (OS) ─────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:41;background:var(--paper);box-shadow:var(--shadow-lg);transform:translateX(104%);transition:transform .28s var(--ease);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.dh .crumb{flex:1;min-width:0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--ink3)}
.db{overflow:auto;padding:20px 20px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:20px;align-content:start}
.dv{display:grid;gap:6px}
.dv .v{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.dv .stmt{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.dv .c{font-size:14px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--ink2);width:max-content;max-width:100%}
.pill.check{background:var(--create-soft);color:var(--create-ink)}
.pill.ok{background:var(--green-soft);color:var(--green-ink)}
.pill.warn{background:var(--amber-soft);color:var(--amber-ink)}
.pill.conf{background:var(--soft);color:var(--ink);border:1px dashed var(--ink3)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.dsec{display:grid;gap:8px}
.dsec > h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.quote{margin:0;padding:14px 16px;background:var(--soft);border-radius:12px;font-size:15px;line-height:1.5}
.quote mark{background:color-mix(in srgb,var(--amber) 40%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.quote .loc{display:block;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.srccard{border:1px solid var(--line-soft);border-radius:12px;padding:14px;display:grid;gap:8px}
.srccard .t{font-weight:600;font-size:14.5px;line-height:1.3}
.srccard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.srccard dt{color:var(--ink3)}
.srccard dd{margin:0;color:var(--ink2)}
.srccard a{color:var(--cobalt);font-size:13px;font-weight:500;text-decoration:none;width:max-content}
.srccard a:hover{text-decoration:underline}
.cites{display:grid;gap:6px}
.citerow{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:9px 12px;border:1px solid var(--line-soft);border-radius:10px;font-size:13.5px}
.citerow:hover{border-color:var(--ink3)}
.citerow b{font-variant-numeric:tabular-nums}
.citerow small{display:block;color:var(--ink3);font-size:12px}
.reason{display:grid;gap:6px;font-size:13.5px;color:var(--ink2)}
.reason ul{margin:0;padding-left:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.form{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--ink2)}
.form textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:64px;resize:vertical}
.form .req{color:var(--create-ink);font-size:11px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt .v{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.opt .q{font-size:13px;color:var(--ink2)}
.opt .s{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.toggle{display:flex;align-items:start;gap:10px;font-size:13.5px;color:var(--ink)}
.toggle small{display:block;color:var(--ink3);font-size:12px}
.toggle input{margin-top:3px;accent-color:var(--ink)}
.code{font-family:var(--mono);font-size:12px;background:var(--soft);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--ink2)}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px;color:var(--ink2)}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.hist li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-top:7px}
.muted{color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:60;max-width:calc(100% - 32px)}

  .shell .doc .app{display:none}
  .titem .x{max-width:170px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function fmt(v,f,unit){

  return false;
}
function stateOf(ref){
  var f=S.facts[ref];
  if(f){ if(f.contest){ var c=S.contests[f.contest]; return c.chosen==null?'contest':'resolved'; }
    if(f.rechecking) return 'rechecking'; return f.status; }
  var fi=S.findings[ref]; if(fi) return fi.status==='proposed'?'check':fi.status;
  return 'sourced';
}
function valueOf(ref){
  var f=S.facts[ref]; if(!f) return '';
  if(f.contest){ var c=S.contests[f.contest]; if(c.chosen!=null) return fmt(c.values[c.chosen].v,f.fmt); }
  return fmt(f.v,f.fmt,f.unit);
}

  if(f.contest){ var c=S.contests[f.contest]; if(c.chosen!=null) return S.sources[c.values[c.chosen].src]; }

// What needs a person: computed over the whole record, whatever the layout shows.

  Object.keys(S.findings).forEach(function(k){ if(S.findings[k].status==='proposed') out.push({ref:k, k:'Check finding', x:S.findings[k].statement}); });

}

class ClanField extends HTMLElement{

class ClanChart extends HTMLElement{

    } else if(kind==='bar'){
      var W2=520,row=38,lw=108,H2=facts.length*row+8, vw=W2-lw-56;
      svg='<svg viewBox="0 0 '+W2+' '+H2+'" role="group" aria-label="'+esc(title)+'">'+facts.map(function(x,i){ var y=i*row+4, w=vw*x.f.v/100;

          +'<rect x="0" y="'+y+'" width="'+W2+'" height="'+(row-6)+'" fill="transparent"/>'
          +'<text x="0" y="'+(y+20)+'" font-size="13" fill="var(--ink2)">'+esc(x.f.x)+'</text>'

function rerender(){ document.querySelectorAll('clan-field,clan-chart,clan-quote,clan-gap,clan-source').forEach(function(e){ e.render(); }); drawTray(); }

// ═══════════════════════════════════════════════════════════════════════
// The needs-you tray
// ═══════════════════════════════════════════════════════════════════════
function drawTray(){
  var t=$('tray'); if(MODE!=='done'){ t.hidden=true; return; } t.hidden=false;
  var n=needs(), h='<div class="tray-in">';
  if(S.locked){ h+='<span class="lockstate">'+TICK+' Locked by you · '+esc(S.locked)+'</span><span class="items"><span class="muted" style="font-size:13px">Changes from here make a new version.</span></span>'; }
  else {
    h+='<span class="who">'+fig('judge',n.length?'needs-you':'idle')+'<span class="count'+(n.length?'':' zero')+'">'+(n.length?n.length+' thing'+(n.length===1?'':'s')+' need you':'Nothing needs you')+'</span></span>';
    h+='<span class="items">'+n.map(function(it){ return '<button type="button" class="titem" data-ref="'+it.ref+'"><span class="k">'+esc(it.k)+'</span><span class="x">'+esc(it.x)+'</span>'+(rendered(it.ref)?'':'<span class="off">not in this layout</span>')+'</button>'; }).join('')+'</span>';
    h+='<button type="button" class="btn primary" id="lockBtn"'+(n.length?' disabled title="Everything above has to be settled first"':'')+'>Lock report'+(n.length?' <span class="n">'+n.length+'</span>':'')+'</button>';
  }
  t.innerHTML=h+'</div>';
}

// ═══════════════════════════════════════════════════════════════════════
// The evidence drawer
// ═══════════════════════════════════════════════════════════════════════
var STACK=[];
function openRef(ref,push){ if(!push) STACK=[]; STACK.push(ref); drawDrawer(); $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden','false'); $('scrim').classList.add('on'); setTimeout(function(){ $('d-close').focus(); },50); }
function closeDrawer(){ $('drawer').classList.remove('on'); $('drawer').setAttribute('aria-hidden','true'); $('scrim').classList.remove('on'); STACK=[]; }
function srcCard(sid,loc){ var s=S.sources[sid];
  return '<div class="srccard"><span class="t">'+(s.material?LOCK+' ':'')+esc(s.title)+'</span><dl><dt>From</dt><dd>'+esc(s.publisher)+'</dd><dt>Kind</dt><dd>'+esc(s.tier)+'</dd><dt>'+(s.material?'Uploaded':'Published')+'</dt><dd>'+esc(s.published)+'</dd>'+(s.material?'':'<dt>Read by agent</dt><dd>'+esc(s.read)+'</dd>')+'<dt>Licence</dt><dd>'+esc(s.licence)+'</dd>'+(loc?'<dt>Where</dt><dd>'+esc(loc)+'</dd>':'')+'</dl>'
    +(s.material?'<button type="button" class="btn" data-act="openmat">Open the file at this passage</button>':'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">Open source ↗</a>')+'</div>'; }
function quoteBlock(q,hl,loc){ var t=esc(q); if(hl){ var e=esc(hl); t=t.replace(e,'<mark>'+e+'</mark>'); } return '<blockquote class="quote">'+t+'<span class="loc">verbatim · '+esc(loc||'')+'</span></blockquote>'; }
function agentWrote(ref){ var el=document.querySelector('#main [data-ref="'+ref+'"]'); var host=el&&el.closest('clan-field,clan-chart,clan-quote,clan-gap');
  var m=host?host.outerHTML.replace(/>[\s\S]*<\//,'></'):null;
  return '<div class="dsec"><h3>What the agent wrote</h3>'+(m?'<div class="code">'+esc(m)+'</div>':'<p class="muted" style="margin:0;font-size:13px">This layout does not show it. It is still in the record, so the tray lists it.</p>')+'</div>'; }
function histBlock(ref){ var hs=HIST.filter(function(h){ return h.ref===ref; }); if(!hs.length) return '';
  return '<div class="dsec"><h3>Recorded</h3><ul class="hist">'+hs.map(function(h){ return '<li><span><b>'+esc(h.kind)+'</b> by you · '+h.at.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+(h.text?' — “'+esc(h.text)+'”':'')+'</span></li>'; }).join('')+'</ul></div>'; }
function statePill(ref){ var st=stateOf(ref), conf=isConf(ref), p='';
  p+={sourced:'<span class="pill">Sourced · quote checked</span>',check:'<span class="pill check">Derived by the agent · needs your check</span>',verified:'<span class="pill ok">'+TICK+' Verified by you</span>',rejected:'<span class="pill check">Rejected by you</span>',contest:'<span class="pill check">Two sources disagree · pick one</span>',resolved:'<span class="pill ok">'+TICK+' Resolved by you</span>',rechecking:'<span class="pill warn">Re-reading the source…</span>'}[st]||'';
  if(conf) p+='<span class="pill conf">'+LOCK+' Client confidential</span>';
  var f=S.facts[ref]; if(f&&f.confidence==='medium') p+='<span class="pill warn">Medium confidence · one source</span>';
  return '<div class="pills">'+p+'</div>'; }
function confForm(ref){
  var o=(S.facts[ref]||S.findings[ref]).classify||{}, inherited=isConf(ref)&&!(o.on);
  return '<form class="form" id="confForm"><b style="font-size:14px">Confidential</b>'
    +(inherited?'<p class="muted" style="margin:0;font-size:12.5px">Already confidential: it comes from material marked confidential when it was uploaded. You can make it stricter here.</p>':'')
    +'<label class="toggle"><input type="checkbox" name="model"'+(o.model===false?'':' checked')+'><span>Agents may read it<small>Only models this agency runs; never a shared or public one.</small></span></label>'
    +'<label class="toggle"><input type="checkbox" name="export"'+(o.export?' checked':'')+'><span>May appear in exports<small>Off: shown as “withheld” in anything that leaves the workspace.</small></span></label>'
    +'<label class="toggle"><input type="checkbox" name="corpus"'+(o.corpus?' checked':'')+'><span>May go into the agency’s knowledge<small>Off: other campaigns never see it.</small></span></label>'
    +'<label>Why <span class="req">required</span><textarea name="why" required placeholder="e.g. Pricing is under NDA until launch"></textarea></label>'
    +'<div class="actions"><button type="submit" class="btn primary">Mark confidential</button><button type="button" class="btn" data-act="cancel">Cancel</button></div></form>';
}
function drawDrawer(){
  var ref=STACK[STACK.length-1], k=kindOf(ref), b='', crumb='', locked=!!S.locked;
  $('d-back').hidden=STACK.length<2;
  if(k==='fact'){
    var f=S.facts[ref], st=stateOf(ref);
    crumb='Fact · '+f.lens.replace(/_/g,' ');
    if(st==='contest'||st==='resolved'){
      var c=S.contests[f.contest];
      b+='<div class="dv"><span class="stmt">'+esc(f.label)+'</span>'+statePill(ref)+'</div>';
      b+='<div class="dsec"><h3>Why they may differ · the agent’s note</h3><p style="margin:0;font-size:14px;color:var(--ink2)">'+esc(c.note)+'</p></div>';
      if(st==='contest'&&!locked){
        b+='<form class="form" id="resolveForm" style="border:0;padding:0"><div class="dsec"><h3>Pick the value the report uses</h3>'+c.values.map(function(v,i){ var s=S.sources[v.src];
          return '<label class="opt"><input type="radio" name="pick" value="'+i+'" required><span style="display:grid;gap:6px"><span class="v">'+esc(fmt(v.v,f.fmt))+'</span><span class="q">“'+esc(v.quote)+'”</span><span class="s">'+esc(s.publisher)+' · '+esc(s.tier)+' · '+esc(yr(s.published))+'</span></span></label>'; }).join('')+'</div>'
          +'<label>Why this one <span class="req">required</span><textarea name="why" required placeholder="e.g. Retail-only is the market we are entering"></textarea></label>'
          +'<div class="actions"><button type="submit" class="btn primary">Use this value</button></div><p class="muted" style="margin:0;font-size:12px">The other value stays on record, marked as not chosen.</p></form>';
      } else {
        var ch=c.values[c.chosen];
        b+='<div class="dsec"><h3>Chosen</h3>'+quoteBlock(ch.quote,ch.hl,ch.loc)+srcCard(ch.src,ch.loc)+'</div>';
        var other=c.values[1-c.chosen];
        b+='<div class="dsec"><h3>Not chosen · kept on record</h3><p style="margin:0;font-size:13.5px;color:var(--ink2)">'+esc(fmt(other.v,f.fmt))+' from '+esc(S.sources[other.src].publisher)+': “'+esc(other.quote)+'”</p></div>';
      }
    } else {
      b+='<div class="dv"><span class="v">'+(isConf(ref)?LOCK:'')+esc(valueOf(ref))+'</span><span class="c">'+esc(f.label)+' · Ireland</span>'+statePill(ref)+'</div>';
      b+='<div class="dsec"><h3>What the source says</h3>'+quoteBlock(f.quote,f.hl,f.loc)+'</div>';
      b+='<div class="dsec"><h3>Source</h3>'+srcCard(f.src,f.loc)+'</div>';
      if(f.checked) b+='<p class="muted" style="margin:0;font-size:12.5px">'+TICK+' Re-read '+esc(f.checked)+': the source still says '+esc(valueOf(ref))+'.</p>';
      if(!locked) b+='<div class="actions" id="baseActs"><button type="button" class="btn" data-act="recheck">Re-verify</button><button type="button" class="btn" data-act="conf">Confidential…</button></div>';
    }
  } else if(k==='finding'){
    var fi=S.findings[ref], st2=stateOf(ref);
    crumb='Finding · synthesis';
    b+='<div class="dv"><span class="stmt">'+(isConf(ref)?LOCK:'')+esc(fi.statement)+'</span>'+statePill(ref)+'</div>';
    b+='<div class="dsec"><h3>Derived from '+fi.cites.length+' recorded facts</h3><div class="cites">'+fi.cites.map(function(c){ var f=S.facts[c], s=S.sources[f.src];
      return '<button type="button" class="citerow" data-open="'+c+'"><span>'+esc(f.label)+'<small>'+esc(s.publisher)+' · '+esc(f.loc)+'</small></span><b>'+(isConf(c)?LOCK:'')+esc(valueOf(c))+'</b></button>'; }).join('')+'</div></div>';
    b+='<div class="dsec reason"><h3>The agent’s reasoning</h3><ul>'+fi.because.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul><span>Certainty: <b>'+esc(fi.certainty)+'</b> · would change with: '+esc(fi.wouldChange)+'</span></div>';
    if(isConf(ref)) b+='<p class="muted" style="margin:0;font-size:12.5px">'+LOCK+' Confidential because it cites your launch brief. A finding takes the strictest licence of what it cites.</p>';
    if(!locked){
      if(st2==='check') b+='<form class="form" id="verdictForm"><label>Note <span class="muted">(required to reject)</span><textarea name="why" placeholder="What you checked, or what is wrong"></textarea></label><div class="actions"><button type="submit" class="btn primary" value="verify">Verify</button><button type="submit" class="btn danger" value="reject">Reject</button><button type="button" class="btn" data-act="conf">Confidential…</button></div><p class="muted" style="margin:0;font-size:12px">Verifying writes it to the agency’s knowledge as reviewed by you. Rejecting keeps it on record, struck through.</p></form>';
      else b+='<div class="actions"><button type="button" class="btn" data-act="undo">Change my verdict</button></div>';
    }
  } else if(k==='quote'){
    var q=S.quotes[ref]; crumb='Quote · consumer culture';
    b+='<div class="dv"><span class="stmt">“'+esc(q.text)+'”</span><span class="c">'+esc(q.by)+'</span>'+statePill(ref)+'</div><div class="dsec"><h3>Source</h3>'+srcCard(q.src,q.loc)+'</div>';
  } else if(k==='gap'){
    var g=S.gaps[ref]; crumb='Gap · looked, not found';
    b+='<div class="dv"><span class="stmt">'+esc(g.what)+'</span><span class="c">'+esc(g.need)+'</span></div><div class="dsec"><h3>What the researcher tried</h3><ul class="hist">'+g.tried.map(function(t){ return '<li><span>'+esc(t)+'</span></li>'; }).join('')+'</ul></div>'
      +(locked?'':'<div class="actions"><button type="button" class="btn" data-act="supply">I have this number…</button><button type="button" class="btn" data-act="recheck-gap">Search again</button></div>');
  } else if(k==='source'){
    var s=S.sources[ref]; crumb='Source';
    var used=Object.keys(S.facts).filter(function(x){ return S.facts[x].src===ref; });
    b+='<div class="dsec">'+srcCard(ref,'')+'</div><div class="dsec"><h3>Facts taken from it ('+used.length+')</h3><div class="cites">'+used.map(function(c){ var f=S.facts[c]; return '<button type="button" class="citerow" data-open="'+c+'"><span>'+esc(f.label)+'<small>'+esc(f.loc)+'</small></span><b>'+esc(valueOf(c))+'</b></button>'; }).join('')+'</div></div>';
  }
  if(k!=='source') b+=histBlock(ref)+agentWrote(ref);
  $('d-crumb').textContent=crumb; $('d-body').innerHTML=b;
}

// drawer events
$('d-close').onclick=closeDrawer; $('scrim').onclick=closeDrawer;
$('d-back').onclick=function(){ STACK.pop(); drawDrawer(); };
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&$('drawer').classList.contains('on')) closeDrawer(); });
$('d-body').addEventListener('click',function(e){
  var o=e.target.closest('[data-open]'); if(o){ openRef(o.getAttribute('data-open'),true); return; }
  var a=e.target.closest('[data-act]'); if(!a) return; var ref=STACK[STACK.length-1], act=a.getAttribute('data-act');
  if(act==='recheck'){ var f=S.facts[ref]; f.rechecking=true; rerender(); drawDrawer(); toast('Sent back to the researcher to read the source again');
    setTimeout(function(){ f.rechecking=false; f.checked='just now'; record('Re-verify',ref,''); rerender(); if(STACK[STACK.length-1]===ref) drawDrawer(); toast('Checked: the source still says '+valueOf(ref)); },1800); }
  else if(act==='conf'){ var box=document.createElement('div'); box.innerHTML=confForm(ref); var anchor=$('baseActs')||$('verdictForm'); anchor.replaceWith(box.firstChild);
    $('confForm').onsubmit=function(ev){ ev.preventDefault(); var fd=new FormData(ev.target); var t=S.facts[ref]||S.findings[ref];
      t.classify={on:true, model:fd.get('model')==='on', export:fd.get('export')==='on', corpus:fd.get('corpus')==='on'}; record('Marked confidential',ref,fd.get('why')); rerender(); drawDrawer(); toast('Marked confidential'); }; }
  else if(act==='cancel'){ drawDrawer(); }
  else if(act==='undo'){ S.findings[ref].status='proposed'; record('Reopened',ref,''); rerender(); drawDrawer(); }
  else if(act==='openmat'){ toast('Would open Harbour Kitchen launch brief.pdf at the quoted passage'); }
  else if(act==='supply'){ toast('Would ask for the number and the material that states it'); }
  else if(act==='recheck-gap'){ toast('Sent back to the Market structure researcher'); }
});
$('d-body').addEventListener('submit',function(e){
  var ref=STACK[STACK.length-1]; e.preventDefault(); var fd=new FormData(e.target), why=(fd.get('why')||'').trim();
  if(e.target.id==='resolveForm'){ var c=S.contests[S.facts[ref].contest]; c.chosen=Number(fd.get('pick')); c.reason=why; record('Resolved',ref,why); rerender(); drawDrawer(); toast('Resolved: the report now uses '+valueOf(ref)); }
  else if(e.target.id==='verdictForm'){ var v=e.submitter&&e.submitter.value;
    if(v==='reject'&&!why){ e.target.why.focus(); e.target.why.setAttribute('aria-invalid','true'); toast('Say why it is wrong, so the agent can fix it'); return; }
    S.findings[ref].status=v==='reject'?'rejected':'verified'; record(v==='reject'?'Rejected':'Verified',ref,why); rerender(); drawDrawer(); toast(v==='reject'?'Rejected':'Verified'); }
});

// clicks on components anywhere in the report or the tray
document.addEventListener('click',function(e){
  if(e.target.closest('#drawer')) return;
  var t=e.target.closest('[data-ref]'); if(t&&(t.closest('#main')||t.closest('#tray'))){ var r=t.getAttribute('data-ref'); var el=document.querySelector('#main [data-ref="'+r+'"]'); if(t.closest('#tray')&&el) el.scrollIntoView({block:'center',behavior:'smooth'}); openRef(r); return; }
  if(e.target.closest('#lockBtn')&&!needs().length){ S.locked=new Date().toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'}); record('Locked','doc',''); render(); toast('Locked. The version and its content hash are sealed.'); }
});
document.addEventListener('keydown',function(e){ var m=e.target.closest&&e.target.closest('.cchart .mark'); if(m&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openRef(m.getAttribute('data-ref')); } });

// Working mode: the crew, the stages, the question. No document yet.
// ═══════════════════════════════════════════════════════════════════════
var ANSWER=null;
function drawWork(){
  var stages=[['read','Read the ask','done'],['read','Brand & category','done'],['judge','Pick the lenses','done'],['research','Research','now'],['synthesise','Synthesise','next'],['draft','Compose report','next']];
  var lenses=[['market_structure','Market structure','working','reading Grocery Share Monitor'],['brands_positioning','Brands and positioning','done','6 facts'],['consumer_culture','Consumer and culture','done','2 facts, 1 quote'],['category_codes','Category codes','working','reading Retail Pulse p. 12'],['rhythm_moments','Rhythm and moments','done','nothing usable'],['media_spend','Media and spend','working','searching'],['effectiveness_evidence','Effectiveness','queued','waiting']];
  var h='<div class="work"><div style="display:grid;gap:8px"><span class="eyebrow">Researching · started 14:02</span><h1>Harbour Kitchen, entering Irish frozen ready meals</h1></div>';
  h+='<ol class="stages">'+stages.map(function(s){ return '<li class="stage '+s[2]+'">'+fig(s[0],s[2]==='now'?'working':'idle',s[0]==='research'?'market_structure':undefined)+'<span class="l">'+s[1]+'</span><span class="s">'+(s[2]==='done'?'done':s[2]==='now'?'working':'next')+'</span></li>'; }).join('')+'</ol>';
  if(!ANSWER) h+='<div class="ask" id="ask">'+fig('research','needs-you','market_structure')+'<div><span class="from">Market structure researcher asks</span><p>Your brief says “Ireland”. Should Northern Ireland count as part of the market?</p><p class="why">Two of the panels report the island as one market. I’ll keep researching the other lenses while you decide.</p><div class="opts"><button type="button" class="btn" data-ans="The Republic only">The Republic only</button><button type="button" class="btn" data-ans="Include Northern Ireland">Include Northern Ireland</button><input type="text" id="ansText" placeholder="Or say it your way" aria-label="Your answer"><button type="button" class="btn primary" data-ans="*">Send</button></div></div></div>';
  else h+='<p class="answered">'+TICK+' You answered: “'+esc(ANSWER)+'”. The researchers carried on.</p>';
  h+='<section class="lenses"><h2>The researchers, lens by lens</h2><div class="lensgrid">'+lenses.map(function(l){ var st=l[2]==='working'?'working':'idle'; return '<div class="lens'+(l[2]==='done'?' done':'')+'">'+fig('research',st,l[0])+'<span>'+l[1]+'<span class="st">'+l[3]+'</span></span></div>'; }).join('')+'</div>'
    +'<div class="live">Market structure · reading “Ireland ready meals, 52 weeks to August 2025” · slide 11 of 24</div></section>';
  h+='<div class="tallies"><div class="tally"><b>11</b><span>sources read</span></div><div class="tally"><b>14</b><span>facts passed the quote check</span></div><div class="tally"><b>1</b><span>gap so far</span></div><div class="tally"><b>1</b><span>disagreement</span></div></div>';
  h+='<p class="later">The report opens here when the crew is done. You check it there: every figure opens its source, and anything that needs you is listed at the top.</p></div>';
  $('main').innerHTML=h;
}
$('main').addEventListener('click',function(e){ var a=e.target.closest('[data-ans]'); if(!a) return; var v=a.getAttribute('data-ans'); if(v==='*'){ v=($('ansText').value||'').trim(); if(!v){ $('ansText').focus(); return; } } ANSWER=v; drawWork(); toast('Answer sent'); });

// ═══════════════════════════════════════════════════════════════════════
// Mode, layout, component outlines
// ═══════════════════════════════════════════════════════════════════════
var MODE='done', LAYOUT='editorial';
function render(){
  document.documentElement.style.setProperty('--shellh',document.querySelector('.shell').offsetHeight+'px');
  document.body.classList.toggle('show-comp',$('showc').checked);
  if(MODE==='work'){ drawWork(); drawTray(); return; }
  var tpl=$('layout-'+LAYOUT).innerHTML;
  $('main').innerHTML='<div class="canvas"><article class="page">'+(S.locked?'<div class="locked-banner">'+TICK+' Locked · this is the accepted version</div>':'')+tpl+'</article></div>';
  drawTray();
}
function press(a,b,on){ $(a).setAttribute('aria-pressed',on?'true':'false'); $(b).setAttribute('aria-pressed',on?'false':'true'); }
$('m-work').onclick=function(){ MODE='work'; press('m-work','m-done',true); closeDrawer(); render(); };
$('m-done').onclick=function(){ MODE='done'; press('m-work','m-done',false); render(); };
$('l-ed').onclick=function(){ LAYOUT='editorial'; press('l-ed','l-br',true); render(); };
$('l-br').onclick=function(){ LAYOUT='briefing'; press('l-ed','l-br',false); render(); };
$('showc').onchange=render;
$('reset').onclick=function(){ fresh(); ANSWER=null; closeDrawer(); render(); toast('Reset'); };
render();
</script>
