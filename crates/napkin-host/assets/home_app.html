<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Napkin Studio</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0f1117;--surface:#141922;--border:#1e2d45;--text:#e2e8f0;--muted:#64748b;--accent:#6366f1;--teal:#2dd4cf}
  body{background:var(--bg);color:var(--text);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:0 36px;-webkit-font-smoothing:antialiased}
  .brand{display:flex;align-items:center;gap:12px;margin-top:9vh;margin-bottom:4px}
  .word{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:30px;letter-spacing:-.01em;color:#eceefb}
  .word .studio{color:var(--teal);font-weight:500}
  .by{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);letter-spacing:.05em;margin-bottom:40px}
  .col{width:100%;max-width:860px}
  .sec{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 14px}
  .sec .ln{flex:1;height:1px;background:var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
  .app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 12px;border-radius:16px;cursor:pointer;
    border:1px solid transparent;transition:background .15s,border-color .15s}
  .app:hover{background:var(--surface);border-color:var(--border)}
  .icon{width:62px;height:62px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--teal));
    display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(99,102,241,.25)}
  .icon.open{background:transparent;border:1px dashed var(--border);color:var(--muted);font-weight:400}
  .app .nm{font-size:13px;font-weight:600;color:var(--text);text-align:center}
  .app .sub{font-size:11px;color:var(--muted)}
  .recents{display:flex;flex-direction:column;gap:2px}
  .rec{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer}
  .rec:hover{background:var(--surface)}
  .rec .ri{width:34px;height:34px;border-radius:9px;background:#1e2d45;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--teal);flex-shrink:0}
  .rec .rt{font-size:13px;color:var(--text)}
  .rec .rd{font-size:11px;color:var(--muted)}
  .rec .rsp{flex:1}
  .empty{color:var(--muted);font-size:13px;padding:6px 2px}
  .foot{margin-top:auto;padding:34px 0 22px}
</style>
</head>
<body>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Napkin Studio">
      <defs><linearGradient id="g" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#2dd4cf"/></linearGradient></defs>
      <path d="M22 14h56c4.4 0 8 3.6 8 8v40L62 86H22c-4.4 0-8-3.6-8-8V22c0-4.4 3.6-8 8-8z" fill="url(#g)"/>
      <path d="M86 62L62 86V70c0-4.4 3.6-8 8-8h16z" fill="#0f1117" fill-opacity="0.55"/>
      <path d="M86 62L62 86V70c0-4.4 3.6-8 8-8h16z" fill="none" stroke="#2dd4cf" stroke-width="2.4" stroke-linejoin="round"/>
    </svg>
    <span class="word">Napkin <span class="studio">Studio</span></span>
  </div>
  <!-- CLAN logo: the lineage-graph mark of the open format underneath -->
  <div class="by">
    powered by
    <svg width="16" height="16" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="CLAN">
      <line x1="70" y1="24" x2="37" y2="21" stroke="#5b6bb0" stroke-width="3" stroke-linecap="round"/>
      <line x1="37" y1="21" x2="18" y2="50" stroke="#5b6bb0" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="50" x2="37" y2="79" stroke="#5b6bb0" stroke-width="3" stroke-linecap="round"/>
      <line x1="37" y1="79" x2="70" y2="76" stroke="#5b6bb0" stroke-width="3" stroke-linecap="round"/>
      <circle cx="70" cy="24" r="6" fill="#6366f1"/><circle cx="37" cy="21" r="6" fill="#5682e9"/>
      <circle cx="18" cy="50" r="7.5" fill="#489de0"/><circle cx="37" cy="79" r="6" fill="#3bb9d8"/><circle cx="70" cy="76" r="6" fill="#2dd4cf"/>
    </svg>
    <span style="font-weight:600;color:#9aa3c7">CLAN</span>
  </div>

  <div class="col">
    <div class="sec">Apps <div class="ln"></div></div>
    <div class="grid" id="apps"></div>
    <div class="empty" id="appsEmpty" style="display:none">No apps installed. Open a <code>.clan</code> template, or run <code>clan app init</code>.</div>

    <div class="sec">Recent <div class="ln"></div></div>
    <div class="recents" id="recents"></div>
    <div class="empty" id="recentsEmpty" style="display:none">No documents yet — launch an app to create one.</div>
  </div>

  <div class="foot"></div>

<script>
  var clanScheme = navigator.userAgent.includes('Windows') ? 'http://clan.localhost' : 'clan://localhost';
  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  // Apps grid (Launchpad-style). Click = launch a new instance.
  fetch(clanScheme + '/apps').then(function(r){return r.json();}).then(function(apps){
    var grid = document.getElementById('apps');
    apps.forEach(function(app){
      var el = document.createElement('div'); el.className='app';
      el.innerHTML = '<div class="icon">'+esc((app.name||'?').slice(0,1).toUpperCase())+'</div>'+
        '<div class="nm">'+esc(app.name)+'</div><div class="sub">v'+esc(app.version)+'</div>';
      el.addEventListener('click', function(){ fetch(clanScheme+'/launch',{method:'POST',body:JSON.stringify({app_id:app.app_id})}); });
      grid.appendChild(el);
    });
    // "Open a .clan file" tile always present at the end of the grid.
    var open = document.createElement('div'); open.className='app';
    open.innerHTML = '<div class="icon open">📂</div><div class="nm">Open file</div><div class="sub">.clan</div>';
    open.addEventListener('click', function(){ fetch(clanScheme+'/open-file',{method:'POST'}); });
    grid.appendChild(open);
    document.getElementById('appsEmpty').style.display = apps.length ? 'none' : 'block';
  }).catch(function(){});

  // Recent documents. Click = open that .clan.
  fetch(clanScheme + '/recent').then(function(r){return r.json();}).then(function(list){
    var box = document.getElementById('recents');
    list.forEach(function(d){
      var el = document.createElement('div'); el.className='rec';
      var when = '';
      try { when = new Date(d.updated_at).toLocaleString(); } catch(e){}
      el.innerHTML = '<div class="ri">📄</div><div><div class="rt">'+esc(d.title||'Untitled')+'</div>'+
        '<div class="rd">'+esc(when)+'</div></div><div class="rsp"></div>';
      el.addEventListener('click', function(){ fetch(clanScheme+'/open',{method:'POST',body:JSON.stringify({path:d.path})}); });
      box.appendChild(el);
    });
    document.getElementById('recentsEmpty').style.display = list.length ? 'none' : 'block';
  }).catch(function(){});
</script>
</body>
</html>
