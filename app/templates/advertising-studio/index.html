      '<div><span class="lab">Loudness target (LUFS)</span><input class="in" id="lufs" type="number" step="0.5" value="' + (get('audio.targets.loudness_lufs') != null ? get('audio.targets.loudness_lufs') : -16) + '" /></div>' +
      '<div><span class="lab">True peak ceiling (dB)</span><input class="in" id="tpk" type="number" step="0.1" value="' + (get('audio.targets.true_peak_db') != null ? get('audio.targets.true_peak_db') : -1) + '" /></div>' +
      '<div><span class="lab">Measured</span><div style="padding-top:7px"><span class="st neutral"><span class="dot"></span>Not measured</span></div></div>' +
      '</div>';

    h += '<div class="sechead">Cues<span class="sh-r">A cue points at the beat it serves.</span></div>';
    if(!tracks.length){
      h += '<div class="empty"><b>No tracks yet.</b>Dialogue, voiceover, music, ambience and effects are separate tracks so a change to one does not disturb the others.' +
        '<div style="margin-top:14px"><button class="btn pri" id="addTrack">Add a track</button></div></div>';
    } else {
      tracks.forEach(function(tr){
        var cues = Array.isArray(tr.cues) ? tr.cues : [];
        h += '<div class="card" style="margin-bottom:11px">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">' +
            '<span class="st info"><span class="dot"></span>' + esc((tr.kind||'track').replace('_',' ')) + '</span>' +
            '<span class="mono muted" style="font-size:11px">' + esc(tr.id) + '</span>' +
            '<span style="flex:1"></span>' +
            '<button class="btn sm" data-addcue="' + esc(tr.id) + '">Add cue</button>' +
          '</div>';
        if(!cues.length) h += '<p class="muted" style="font-size:12.5px">No cues on this track.</p>';
        cues.forEach(function(c){
          var bad = c.kind==='scratch';
          h += '<div class="listrow" style="align-items:center;flex-wrap:wrap">' +
            '<span class="mono" style="font-size:10.5px;color:var(--accent2)">' + esc(c.id) + '</span>' +
            '<span style="flex:1;min-width:140px">' + esc(c.text || '—') + '</span>' +
            (c.beat_id ? '<span class="pill">beat ' + esc(c.beat_id) + '</span>' : '') +
            '<span class="mono muted" style="font-size:11px">@' + (c.place_at_s!=null?c.place_at_s:0) + 's</span>' +
            (bad ? '<span class="st warn"><span class="dot"></span>Scratch</span>'
                 : '<span class="st ' + (c.status==='approved'?'ok':'neutral') + '"><span class="dot"></span>' + esc(c.status||'planned') + '</span>') +
            '<span class="x" data-delcue="' + esc(tr.id) + '|' + esc(c.id) + '">×</span>' +
          '</div>';
        });
        h += '</div>';
      });
      h += '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="addTrack">Add a track</button></div>';
    }

    h += '<div class="sechead">Final listen</div>';
    var lt = get('audio.listened_through') === true;
    h += '<div class="card"><label class="checkline" style="font-size:13px">' +
      '<input type="checkbox" id="listened"' + (lt?' checked':'') + ' /> ' +
      'A human has played the whole track through, start to finish.</label>' +
      '<p class="muted" style="font-size:12px;margin-top:6px">Measurement is not review. This is required before anything is called final.</p></div>';

    if(!beats.length) h += '';
    return h;
  }

  function wireSound(){
    function setAudio(fn, action){
      var a = JSON.parse(JSON.stringify(get('audio') || {}));
      fn(a);
      return put('audio', a, action || 'edit audio');
    }
    var at = document.getElementById('addTrack');
    if(at) at.addEventListener('click', function(){
      var kind = prompt('Track kind — dialogue, voiceover, music, ambience or fx:', 'voiceover');
      if(!kind) return;
      kind = kind.trim().toLowerCase();
      if(['dialogue','voiceover','music','ambience','fx'].indexOf(kind) < 0){ toast('That is not one of the five track kinds.'); return; }
      setAudio(function(a){ a.tracks = a.tracks||[]; a.tracks.push({ id: uid('trk'), kind: kind, cues: [] }); }, 'add ' + kind + ' track').then(render);
    });
    document.querySelectorAll('[data-addcue]').forEach(function(b){
      b.addEventListener('click', function(){
        var tid = b.getAttribute('data-addcue');
        var text = prompt('The line, or a description of the cue:');
        if(text==null) return;
        var at2 = prompt('Place it at how many seconds in?', '0');
        var beats = beatsOf(currentRev());
        var beatId = '';
        if(beats.length){
          var pick = prompt('Which beat does it serve? Leave blank for none.\n' + beats.map(function(x,i){ return i + ': ' + x.id + ' — ' + (x.visual_action||'').slice(0,40); }).join('\n'));
          if(pick!=null && pick!=='' && beats[Number(pick)]) beatId = beats[Number(pick)].id;
        }
        setAudio(function(a){
          (a.tracks||[]).forEach(function(t){
            if(t.id!==tid) return;
            t.cues = t.cues||[];
            t.cues.push({ id: uid('cue'), text:text, place_at_s: Number(at2)||0, beat_id: beatId, gain_db:0, status:'planned' });
          });
        }, 'add audio cue').then(render);
      });
    });
    document.querySelectorAll('[data-delcue]').forEach(function(x){
      x.addEventListener('click', function(){
        var p = x.getAttribute('data-delcue').split('|');
        setAudio(function(a){
          (a.tracks||[]).forEach(function(t){ if(t.id===p[0]) t.cues = (t.cues||[]).filter(function(c){ return c.id!==p[1]; }); });
        }, 'remove audio cue').then(render);
      });
    });
    ['lufs','tpk'].forEach(function(id){
      var e = document.getElementById(id);
      if(e) e.addEventListener('change', function(){
        setAudio(function(a){
          a.targets = a.targets||{};
          if(id==='lufs') a.targets.loudness_lufs = Number(e.value); else a.targets.true_peak_db = Number(e.value);
        }, 'set audio target');
      });
    });
    var l = document.getElementById('listened');
    if(l) l.addEventListener('change', function(){
      setAudio(function(a){ a.listened_through = l.checked; }, 'record final listen').then(render);
    });
  }

  // ── step: edit ────────────────────────────────────────────────────────
  function currentTimeline(){
    var revs = arr('timeline.revisions'); if(!revs.length) return null;
    var cur = get('timeline.current');
    for(var i=0;i<revs.length;i++) if(revs[i].id===cur) return revs[i];
    return revs[revs.length-1];
  }

  function renderEdit(){
    var tl = currentTimeline();
    var h = '<div class="notice"><span class="ni">!</span><div><b>This is the specification, not a renderer</b>' +
      '<span>Preview and final render must come from the same timeline, and neither runs here — both need the ' +
      'production service. What this step owns is the spec: which take, which range, where it sits.</span></div></div>';

    if(!tl){
      var sh = shots();
      h += '<div class="empty"><b>No timeline yet.</b>' +
        (sh.length ? 'An assembly can be laid out from the shot board in order — durations and selected takes, nothing invented.'
                   : 'Build the shot board first; there is nothing to assemble.') +
        (sh.length ? '<div style="margin-top:14px"><button class="btn pri" id="assemble">Assemble from storyboard</button></div>' : '') +
        '</div>';
      return h;
    }

    var revs = arr('timeline.revisions');
    h += '<div class="revbar"><span class="lab" style="margin:0 4px 0 0">Revisions</span>';
    revs.forEach(function(r){
      h += '<button class="pill' + (r.id===tl.id?' on':'') + '" data-tlrev="' + esc(r.id) + '"><span class="mono">' + esc(r.id) + '</span></button>';
    });
    h += '<span style="flex:1"></span><button class="btn" id="assemble">Re-assemble from storyboard</button></div>';

    var dur = Number(tl.duration_frames) || Math.round(targetDur() * fps());
    h += '<div class="card" style="margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap">' +
      '<div><span class="lab">Frame rate</span><b class="mono">' + (tl.frame_rate || fps()) + ' fps</b></div>' +
      '<div><span class="lab">Duration</span><b class="mono">' + dur + ' frames · ' + (dur/(tl.frame_rate||fps())).toFixed(2) + 's</b></div>' +
      '<div><span class="lab">Tracks</span><b class="mono">' + (tl.tracks||[]).length + '</b></div>' +
      '</div>';

    h += '<div class="tl">';
    (tl.tracks||[]).forEach(function(tr){
      var cls = tr.kind==='picture' ? 'picture' : (tr.kind==='titles'||tr.kind==='captions') ? 'text' : 'audio';
      h += '<div class="tlrow"><div class="tlname">' + esc(tr.kind) + '</div><div class="tltrack">';
      (tr.clips||[]).forEach(function(c){
        var at = Number(c.at_frames)||0;
        var len = Math.max(1, (Number(c.source_out_frames)||0) - (Number(c.source_in_frames)||0));
        var left = dur ? (at/dur*100) : 0, w = dur ? (len/dur*100) : 0;
        var label = c.text || c.source_take || c.source_cue || c.id;
        h += '<div class="clip ' + cls + '" style="left:' + left + '%;width:' + Math.max(1.2, w) + '%" title="' + esc(label) + '">' + esc(label) + '</div>';
      });
      h += '</div></div>';
    });
    h += '</div>';

    var props = arr('timeline.proposals').filter(function(p){ return p.status==='pending'; });
    if(props.length){
      h += '<div class="sechead">Proposed edits<span class="sh-r">Shown before they apply. A rejected one changes nothing.</span></div>';
      props.forEach(function(p){
        h += '<div class="card" style="margin-bottom:9px">' +
          '<p style="font-size:13.5px;margin-bottom:8px">“' + esc(p.instruction) + '”</p>' +
          '<div class="pillrow" style="margin-bottom:10px">' +
            (Array.isArray(p.affected_clips) ? p.affected_clips.map(function(c){ return '<span class="pill">' + esc(c) + '</span>'; }).join('') : '') +
            (Array.isArray(p.range_frames) && p.range_frames.length===2 ? '<span class="pill">frames ' + p.range_frames[0] + '–' + p.range_frames[1] + '</span>' : '') +
          '</div>' +
          '<div style="display:flex;gap:8px;align-items:center">' +
            '<button class="btn sm" data-rejprop="' + esc(p.id) + '">Reject</button>' +
            '<span class="muted" style="font-size:12px">Applying an edit is the production service’s job — the proposal carries no resulting timeline to merge.</span>' +
          '</div></div>';
      });
    }
    return h;

  // ── step: deliver ─────────────────────────────────────────────────────
  var ASPECTS = { '16:9':[1920,1080], '9:16':[1080,1920], '1:1':[1080,1080] };

  function renderDeliver(){
    var h = '';

    h += '<div class="sechead">Final-ready<span class="sh-r">Computed from this file, every time you look.</span></div>';

      h += '<div class="card"><span class="st ok"><span class="dot"></span>Nothing is blocking delivery</span>' +

      h += '<div class="card"><div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">' +
        '<span class="st warn"><span class="dot"></span>' + bl.length + ' blocking ' + (bl.length===1?'issue':'issues') + '</span>' +
        '<span class="muted" style="font-size:12px">A clearly-labelled review cut is still possible.</span></div>' +
        '<div class="blockers">' + bl.map(function(x){

    h += '<div class="sechead">Formats<span class="sh-r">A vertical version is a new framing, not a new canvas.</span></div>';
    var fm = arr('formats');
    h += '<div class="fgrid">';

      var f = fm.filter(function(x){ return x.aspect===a; })[0];
      var dims = ASPECTS[a];
      if(!f){
        h += '<div class="fmt"><div class="fmtprev" style="aspect-ratio:' + a.replace(':','/') + '">' + a + '</div>' +
          '<b style="font-size:13px">' + a + '</b>' +
          '<p class="muted" style="font-size:12px;margin:5px 0 10px">' + dims[0] + '×' + dims[1] + ' · not created</p>' +
          '<button class="btn sm" data-mkfmt="' + a + '">Create this format</button></div>';

      }
      var ck = f.checks || {};
      h += '<div class="fmt"><div class="fmtprev" style="aspect-ratio:' + a.replace(':','/') + '">' + a + '</div>' +
        '<div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px">' + a + '</b>' +
        (f.status==='approved' ? '<span class="st ok"><span class="dot"></span>Approved</span>'
          : '<span class="st neutral"><span class="dot"></span>' + esc(f.status||'draft') + '</span>') + '</div>' +
        '<p class="muted" style="font-size:12px;margin:5px 0 8px">' + (f.width||dims[0]) + '×' + (f.height||dims[1]) + '</p>' +
        '<label class="checkline"><input type="checkbox" data-ck="' + esc(f.id) + '|important_action_visible"' + (ck.important_action_visible?' checked':'') + ' /> Important action survives the crop</label>' +
        '<label class="checkline"><input type="checkbox" data-ck="' + esc(f.id) + '|cta_fits"' + (ck.cta_fits?' checked':'') + ' /> CTA fits the frame</label>' +
        '<label class="checkline"><input type="checkbox" data-ck="' + esc(f.id) + '|required_copy_fits"' + (ck.required_copy_fits?' checked':'') + ' /> Required copy fits</label>' +
        (f.status!=='approved' ? '<button class="btn sm" style="margin-top:9px" data-apfmt="' + esc(f.id) + '">Approve format</button>' : '') +
        '</div>';
    });
    h += '</div>';

    h += '<div class="sechead">Exports</div>';
    var ex = arr('exports');
    if(!ex.length){
      h += '<div class="empty">Nothing has been exported. Rendering an actual file needs the production service — ' +
        'a progress bar here would be a lie, so there isn’t one.</div>';
    } else {
      h += '<div class="card">' + ex.map(function(e){
        var st = (e.validated && e.downloadable) ? '<span class="st ok"><span class="dot"></span>Validated</span>'
          : e.validated ? '<span class="st warn"><span class="dot"></span>Validated, not confirmed downloadable</span>'
          : '<span class="st warn"><span class="dot"></span>Not validated</span>';
        var m = e.measured || {};
        return '<div class="listrow"><span class="mono" style="font-size:11px">' + esc(e.id) + '</span>' +
          '<span style="flex:1">' + esc(e.format_id||'') + ' · ' + esc(e.profile||'') + '</span>' +
          (m.duration_frames!=null ? '<span class="mono muted" style="font-size:11px">' + m.duration_frames + 'f</span>' : '') +
          (m.loudness_lufs!=null ? '<span class="mono muted" style="font-size:11px">' + m.loudness_lufs + ' LUFS</span>' : '') +
          st + '</div>';
      }).join('') + '</div>';
    }

    var dp = arr('delivery_profiles');
    if(dp.length){
      h += '<div class="sechead">Delivery profiles<span class="sh-r">Unverified means nobody has proved a file against it.</span></div>';
      h += '<div class="card">' + dp.map(function(p){

          '<span class="muted">' + esc(p.container||'') + ' / ' + esc(p.video_codec||'') + ' / ' + esc(p.audio_codec||'') + '</span>' +
          '<span style="flex:1"></span>' +
          (p.verified ? '<span class="st ok"><span class="dot"></span>Verified</span>' : '<span class="st neutral"><span class="dot"></span>Unverified</span>') +
          '</div>';

  function wireDeliver(){
    document.querySelectorAll('[data-mkfmt]').forEach(function(b){
      b.addEventListener('click', function(){
        var a = b.getAttribute('data-mkfmt'), d = ASPECTS[a];
        var list = arr('formats').slice();
        list.push({ id: uid('fmt'), aspect:a, width:d[0], height:d[1],
          timeline_revision: (currentTimeline()||{}).id || '', status:'draft', checks:{}, framing:[] });
        put('formats', list, 'create format ' + a).then(render);
      });
    });
    document.querySelectorAll('[data-ck]').forEach(function(c){
      c.addEventListener('change', function(){
        var p = c.getAttribute('data-ck').split('|');
        var list = arr('formats').map(function(f){
          if(f.id!==p[0]) return f;
          var n = JSON.parse(JSON.stringify(f)); n.checks = n.checks||{}; n.checks[p[1]] = c.checked; return n;
        });
        put('formats', list, 'record format check');
      });
    });
    document.querySelectorAll('[data-apfmt]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-apfmt');
        var f = arr('formats').filter(function(x){ return x.id===id; })[0];
        if(!f) return;
        var ck = f.checks||{};
        if(!ck.important_action_visible || !ck.cta_fits || !ck.required_copy_fits){
          if(!confirm('Not every framing check is ticked. Approve anyway?')) return;
        }
        var list = arr('formats').map(function(x){ return x.id===id ? Object.assign({}, x, {status:'approved'}) : x; });
        put('formats', list, 'approve format')
          .then(function(){ return approve('format', id, f.timeline_revision || 'v1', 'framing reviewed in ' + f.aspect); })
          .then(render);
      });
    });
    var rg = document.getElementById('recordGate');
    if(rg) rg.addEventListener('click', function(){
      var bl = blockers();
      putMany({ stage: Object.assign({}, get('stage')||{}, { final_ready: bl.length===0, blocked_by: bl }) },
        'record readiness check', bl.length ? bl.length + ' issue(s) outstanding' : 'nothing outstanding')
        .then(function(){ toast('Readiness recorded in the file.'); });
    });
  }

    var dep = arr('shots').filter(function(s){ return s.source_beat===bt.id; });
    var cues = [];
    arr('audio.tracks').forEach(function(t){ (t.cues||[]).forEach(function(c){ if(c.beat_id===bt.id) cues.push(c); }); });
    var h = '<div class="insphead"><div class="k">Beat · ' + esc(bt.id) + '</div>' +
      '<h3>' + esc((bt.visual_action||'Untitled beat').slice(0,70)) + '</h3>' +
      '<div class="pillrow"><span class="pill">' + (Number(bt.duration_s)||0) + 's</span>' +

      '</div></div><div class="inspbody">';
    h += '<div><span class="lab">What depends on this beat</span>';

          '<span class="muted" style="font-size:11.5px">' + esc(fmtCost(t.cost)) + '</span>' +
          (t.selected ? '<span class="st ok"><span class="dot"></span>Selected</span>'
                      : '<button class="btn sm" data-seltake="' + esc(t.id) + '">Select</button>') +
          '</div>';
      });
      h += '</div>';

      h += '<div><span class="lab">Checks</span><p class="muted" style="font-size:12px">' +
        'A file that decodes has passed a technical check, not a creative one. Creative checks are recorded per take ' +
        'against the approved plan.</p></div>';
    }

    if(view.tab==='details'){
      h += det('Shot id', '<span class="mono">' + esc(s.id) + '</span>');
      h += det('Revision', '<span class="mono">' + esc(s.revision||'') + '</span>');
      h += det('Script revision', '<span class="mono">' + esc(s.script_revision||'') + '</span>');
      h += det('Order', String(s.order||0));
      h += det('Method', esc(methodLabel(s.method)));
      var b = blockingFor(s.id);
      h += det('Blocking', b ? (b.required===false ? 'Not required' : esc(b.status||'draft')) : '<span class="muted">none</span>');
      h += det('Approvals', String(approvalsFor('shot', s.id, null).length));
      h += '<div><span class="lab">Continuity constraints</span>' +
        ((s.continuity||[]).map(function(c){ return '<div class="listrow"><span>' + esc(c) + '</span></div>'; }).join('') ||
         '<p class="muted" style="font-size:12.5px">None recorded.</p>') + '</div>';
      h += '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:6px">' +
        '<button class="btn sm" id="dupShot">Duplicate</button>' +
        '<button class="btn sm" id="mvUp">Move earlier</button>' +
        '<button class="btn sm" id="mvDown">Move later</button>' +
        '<button class="btn sm danger" id="rmShot">Remove shot</button></div>';
    }
    h += '</div>';
    return h;
  }

  function wireInspShot(){
    document.querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){ view.tab = b.getAttribute('data-tab'); renderInspector(); });
    });
    document.querySelectorAll('[data-s]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var f = inp.getAttribute('data-s');
        var v = (f==='duration_s') ? Number(inp.value) : inp.value;
        updateShot(view.shot, function(s){ s[f] = v; }, 'edit shot ' + f).then(render);
      });
    });
    document.querySelectorAll('[data-seltake]').forEach(function(b){
      b.addEventListener('click', function(){
        var tid = b.getAttribute('data-seltake');
        var list = arr('takes').map(function(t){
          if(t.shot_id!==view.shot) return t;
          return Object.assign({}, t, { selected: t.id===tid });
        });
        put('takes', list, 'select take', 'locked one take for this shot').then(function(){
          return updateShot(view.shot, function(s){ s.selected_take = tid; }, 'lock selected take');
        }).then(render);
      });
    });
    var cs = document.getElementById('inspClearStale');
    if(cs) cs.addEventListener('click', function(){ clearStale('shot', view.shot).then(render); });
    var du = document.getElementById('dupShot');
    if(du) du.addEventListener('click', function(){
      var s = shotById(view.shot); if(!s) return;
      var list = arr('shots').slice();
      var c = JSON.parse(JSON.stringify(s)); c.id = uid('shot'); c.order = (s.order||0) + 1; c.selected_take = undefined;
      list.forEach(function(x){ if(x.id!==s.id && (x.order||0) > (s.order||0)) x.order = (x.order||0) + 1; });
      list.push(c);
      writeShots(list, 'duplicate shot').then(function(){ view.shot = c.id; render(); });
    });
    function move(dir){
      var list = shots(); var ix = -1;
      list.forEach(function(x,i){ if(x.id===view.shot) ix = i; });
      var j = ix + dir; if(ix<0 || j<0 || j>=list.length) return;
      var a = list[ix], b = list[j];
      var out = arr('shots').map(function(x){
        if(x.id===a.id) return Object.assign({}, x, {order: b.order});
        if(x.id===b.id) return Object.assign({}, x, {order: a.order});
        return x;
      });
      writeShots(out, 'reorder shots').then(render);
    }
    var mu = document.getElementById('mvUp'); if(mu) mu.addEventListener('click', function(){ move(-1); });
    var md = document.getElementById('mvDown'); if(md) md.addEventListener('click', function(){ move(1); });
    var rm = document.getElementById('rmShot');
    if(rm) rm.addEventListener('click', function(){
      var ts = takesFor(view.shot);
      if(!confirm('Remove this shot?' + (ts.length ? ' Its ' + ts.length + ' take(s) stay in the file and in their vault.' : ''))) return;
      var gone = view.shot;
      writeShots(arr('shots').filter(function(x){ return x.id!==gone; }), 'remove shot').then(function(){
        view.shot = null; render();
      });
    });
  }

  function inspBlocking(){
    var b = view.shot ? blockingFor(view.shot) : null;
    var s = view.shot ? shotById(view.shot) : null;
    if(!b || !s) return inspGeneric();
    var fp = b.floor_plan || {};
    var subs = Array.isArray(fp.subjects) ? fp.subjects : [];
    var su = view.subject ? subs.filter(function(x){ return x.id===view.subject; })[0] : null;

    var h = '<div class="insphead"><div class="k">Blocking · shot ' + String(s.order||0).padStart(2,'0') + '</div>' +
      '<h3>' + esc(su ? (su.label||su.id) : 'The recipe') + '</h3>' +
      '<div class="pillrow">' +
        (b.status==='approved' ? '<span class="st ok"><span class="dot"></span>Approved</span>'
          : '<span class="st warn"><span class="dot"></span>' + esc(b.status||'draft') + '</span>') +
        '<span class="pill mono">' + esc(b.revision||'b1') + '</span>' +
      '</div></div><div class="inspbody">';

    if(su){
      h += '<div><span class="lab">Label</span><input class="in" data-su="label" value="' + esc(su.label||'') + '" /></div>';
      h += '<div><span class="lab">Kind</span><select class="in" data-su="kind">' +
        SUBJ_KINDS.map(function(k){ return '<option value="' + k[0] + '"' + (su.kind===k[0]?' selected':'') + '>' + k[1] + '</option>'; }).join('') +
        '</select></div>';
      var st0 = su.start||{x:0,y:0}, en0 = su.end||st0;
      h += '<div class="row2">' +
        '<div><span class="lab">Start x (m)</span><input class="in" type="number" step="0.1" data-su="start.x" value="' + (st0.x||0) + '" /></div>' +
        '<div><span class="lab">Start y (m)</span><input class="in" type="number" step="0.1" data-su="start.y" value="' + (st0.y||0) + '" /></div>' +
        '</div>';
      h += '<div class="row2">' +
        '<div><span class="lab">End x (m)</span><input class="in" type="number" step="0.1" data-su="end.x" value="' + (en0.x||0) + '" /></div>' +
        '<div><span class="lab">End y (m)</span><input class="in" type="number" step="0.1" data-su="end.y" value="' + (en0.y||0) + '" /></div>' +
        '</div>';
      h += '<div><span class="lab">Facing (degrees)</span><input class="in" type="number" step="5" data-su="start.rotation_deg" value="' + (st0.rotation_deg||0) + '" /></div>';
      h += '<div style="display:flex;gap:7px"><button class="btn sm danger" id="rmSub">Remove from the plan</button>' +
           '<button class="btn sm" id="deselSub">Done</button></div>';
      h += '<hr style="border:none;border-top:1px solid var(--border);margin:4px 0" />';
    }

    h += '<div><span class="lab">Contact points</span>';
    h += (b.contact_points||[]).length ? (b.contact_points||[]).map(function(c,i){
      var A = subs.filter(function(x){return x.id===c.a;})[0], B2 = subs.filter(function(x){return x.id===c.b;})[0];
      return '<div class="listrow"><span>' + esc((A?A.label:c.a) + ' ↔ ' + (B2?B2.label:c.b)) +
        (c.at_s!=null ? ' <span class="mono muted">@' + c.at_s + 's</span>' : '') + '</span>' +
        '<span class="x" data-rmpair="contact_points|' + i + '">×</span></div>';
    }).join('') : '<p class="muted" style="font-size:12.5px">None recorded.</p>';
    h += '</div>';

    h += '<div><span class="lab">Must never intersect</span>';
    h += (b.forbidden_intersections||[]).length ? (b.forbidden_intersections||[]).map(function(c,i){
      var A = subs.filter(function(x){return x.id===c.a;})[0], B2 = subs.filter(function(x){return x.id===c.b;})[0];
      return '<div class="listrow"><span>' + esc((A?A.label:c.a) + ' × ' + (B2?B2.label:c.b)) + '</span>' +
        '<span class="x" data-rmpair="forbidden_intersections|' + i + '">×</span></div>';
    }).join('') : '<p class="muted" style="font-size:12.5px">None recorded.</p>';
    h += '</div>';

    h += '<div><span class="lab">Start and end frames</span>';
    var fr = b.frames || {};
    h += '<div class="listrow"><span class="muted">Start frame</span><span style="flex:1"></span>' +
      (fr.start_asset ? '<span class="mono">' + esc(String(fr.start_asset).slice(0,10)) + '</span>' : '<span class="st neutral"><span class="dot"></span>Not captured</span>') + '</div>';
    h += '<div class="listrow"><span class="muted">End frame</span><span style="flex:1"></span>' +
      (fr.end_asset ? '<span class="mono">' + esc(String(fr.end_asset).slice(0,10)) + '</span>' : '<span class="st neutral"><span class="dot"></span>Not captured</span>') + '</div>';
    h += '</div>';

    h += '<div><span class="lab">Motion preview</span>' +
      (b.motion_preview ? '<span class="mono">' + esc(String(b.motion_preview).slice(0,12)) + '</span>'
        : '<p class="muted" style="font-size:12.5px">Not generated. A low-cost preview of this move needs the production service.</p>') + '</div>';

    h += '<div><span class="lab">Provider capability</span>';
    var pc = b.provider_capabilities;
    if(!pc || !pc.provider){
      h += '<p class="muted" style="font-size:12.5px">No adapter has declared against this recipe. Until one does, treat every ' +
           'control here as unenforced — a prompt does not guarantee physical control.</p>';
    } else {
      h += '<div class="listrow"><b>' + esc(pc.provider) + '</b><span class="muted" style="font-size:11.5px">' + esc(pc.declared_at||'') + '</span></div>';
      h += '<div class="pillrow" style="margin-top:6px">' +
        (pc.accepted||[]).map(function(a){ return '<span class="st ok"><span class="dot"></span>' + esc(a) + '</span>'; }).join('') +
        (pc.rejected||[]).map(function(a){ return '<span class="st bad"><span class="dot"></span>' + esc(a) + '</span>'; }).join('') +
        '</div>';
      if((pc.rejected||[]).length)
        h += '<p class="muted" style="font-size:12px;margin-top:7px">The rejected constraints stay on the record and are still ' +
             'reviewed against the result, even though the provider cannot enforce them.</p>';
    }
    h += '</div>';
    h += '</div>';
    return h;
  }

  function wireInspBlocking(){
    document.querySelectorAll('[data-su]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var f = inp.getAttribute('data-su');
        var v = (inp.type==='number') ? Number(inp.value) : inp.value;
        updateBlocking(view.shot, function(x){
          (((x.floor_plan||{}).subjects)||[]).forEach(function(s){
            if(s.id!==view.subject) return;
            var p = f.split('.');
            if(p.length===1){ s[p[0]] = v; }
            else { s[p[0]] = s[p[0]] || {}; s[p[0]][p[1]] = v; }
          });
        }, 'edit subject ' + f).then(render);
      });
    });
    var rs = document.getElementById('rmSub');
    if(rs) rs.addEventListener('click', function(){
      var id = view.subject;
      updateBlocking(view.shot, function(x){
        var fp = x.floor_plan||{};
        fp.subjects = (fp.subjects||[]).filter(function(s){ return s.id!==id; });
        x.contact_points = (x.contact_points||[]).filter(function(c){ return c.a!==id && c.b!==id; });
        x.forbidden_intersections = (x.forbidden_intersections||[]).filter(function(c){ return c.a!==id && c.b!==id; });
      }, 'remove subject from floor plan').then(function(){ view.subject = null; render(); });
    });
    var ds = document.getElementById('deselSub');
    if(ds) ds.addEventListener('click', function(){ view.subject = null; renderInspector(); });
    document.querySelectorAll('[data-rmpair]').forEach(function(x){
      x.addEventListener('click', function(){
        var p = x.getAttribute('data-rmpair').split('|'), key = p[0], ix = Number(p[1]);
        updateBlocking(view.shot, function(b){ (b[key]||[]).splice(ix,1); }, 'remove ' + key.replace('_',' ')).then(render);
      });
    });
  }

  // ── render ────────────────────────────────────────────────────────────
  function render(){
    renderRail(); renderGate(); renderHead();
    var body = document.getElementById('body');
    var h = '';
    switch(view.step){
      case 'brief': h = renderBrief(); break;
      case 'script': h = renderScript(); break;
      case 'storyboard': h = renderStoryboard(); break;
      case 'blocking': h = renderBlocking(); break;
      case 'sound': h = renderSound(); break;
      case 'edit': h = renderEdit(); break;
      case 'deliver': h = renderDeliver(); break;
      default: h = renderTools();
    }
    body.innerHTML = h;
    switch(view.step){
      case 'brief': wireBrief(); break;
      case 'script': wireScript(); break;
      case 'storyboard': wireStoryboard(); break;
      case 'blocking': wireBlocking(); break;
      case 'sound': wireSound(); break;
      case 'edit': wireEdit(); break;
      case 'deliver': wireDeliver(); break;
      default: wireTools();
    }
    renderInspector();
  }

  // ── boot ──────────────────────────────────────────────────────────────
  // The schema's nine stages collapse onto seven steps: `picture` lives in
  // Storyboard's Media tab, `formats` lives in Deliver.
  var STAGE_TO_STEP = { brief:'brief', script:'script', storyboard:'storyboard', blocking:'blocking',
                        picture:'storyboard', sound:'sound', edit:'edit', formats:'deliver', deliver:'deliver' };
  var startStage = get('stage.current');
  if(startStage && STAGE_TO_STEP[startStage]) view.step = STAGE_TO_STEP[startStage];

  render();
  window.addEventListener('clan:dataupdated', render);
  window.addEventListener('clan:colorscheme', render);
  window.addEventListener('napkin:ready', function(){ render(); });
})();
</script>
</body>
