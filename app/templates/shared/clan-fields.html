<!-- The OS's fields: the components every Napkin app shows recorded data with.
     Spliced into a template at its clan-fields marker by the packer
     (crates/clan-sdk/examples/shared/app_ui.rs), after the agent figures.
     Hand-written; the contract is docs/contracts/clan-fields.md. -->
<style id="clan-fields-css">
/* Tokens come from the app (the studio's set); each has a fallback so the
   fields still read in a page that defines none. */
:root,clan-field,clan-cite,clan-chart,clan-quote,clan-gap,clan-sources,clan-tray,.clf-drawer,.clf-scrim,.clf-toast{
  --clf-ink:var(--ink,#14161B); --clf-ink2:var(--ink2,#4A4F5C); --clf-ink3:var(--ink3,#737987);
  --clf-paper:var(--paper,#FFFFFF); --clf-soft:var(--soft,#F5F6F8); --clf-line:var(--line,#D6DAE2); --clf-line2:var(--line-soft,#E7E9EE);
  --clf-create:var(--create,#FF4F2E); --clf-create-soft:var(--create-soft,#FFF1EE); --clf-create-ink:var(--create-ink,#B8321A);
  --clf-green-soft:var(--green-soft,#DCFCE7); --clf-green-ink:var(--green-ink,#146C35);
  --clf-amber:var(--amber,#F5A524); --clf-amber-soft:var(--amber-soft,#FEF3DC); --clf-amber-ink:var(--amber-ink,#8A5A00);
  --clf-chart:var(--clf-chart-1,#2F64F5); --clf-chart2:var(--clf-chart-2,#9DB5F8);
  --clf-mono:var(--mono,"Geist Mono",ui-monospace,Menlo,Consolas,monospace);
  --clf-ease:var(--ease,cubic-bezier(.2,.8,.2,1));
}
clan-field,clan-cite,clan-chart,clan-quote,clan-gap,clan-sources{display:contents}
clan-field[as="big"],clan-field[as="stat"],clan-chart,clan-quote,clan-gap,clan-sources{display:block}
clan-tray{display:block}
.clf-lock{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;flex:none}

/* ── a field ─────────────────────────────────────────────────────────── */
.clf{all:unset;cursor:pointer;border-radius:6px;transition:background .15s var(--clf-ease);color:inherit}
.clf:hover{background:color-mix(in srgb,var(--clf-ink) 5%,transparent)}
.clf:focus-visible{outline:2px solid var(--clf-create);outline-offset:2px}
.clf-src{font-family:var(--clf-mono);font-size:10.5px;letter-spacing:.02em;color:var(--clf-ink3);white-space:nowrap;font-weight:400}
.clf-src::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px;opacity:.7}
.clf.in{display:inline;padding:0 2px;font-weight:600;font-variant-numeric:tabular-nums;border-bottom:1.5px solid color-mix(in srgb,var(--clf-ink) 22%,transparent)}
.clf.in .clf-src{margin-left:4px}
.clf.in.txt{font-weight:inherit;border-bottom-style:dotted}
.clf.big,.clf.stat{display:grid;gap:4px;padding:6px;margin:-6px}
.clf.big .v{font-size:clamp(34px,5vw,54px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.clf.stat .v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.clf.big .c,.clf.stat .c{font-size:13.5px;color:var(--clf-ink2);line-height:1.35}
.clf.cell{display:inline-grid;justify-items:end;padding:2px 4px;margin:-2px -4px}
.clf.cell .v{font-weight:700;font-variant-numeric:tabular-nums}
.clf.claim{display:inline;padding:1px 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.clf .tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--clf-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:1px 7px;vertical-align:2px;white-space:nowrap;font-weight:500;text-decoration:none}
.clf.s-check.claim{background:var(--clf-create-soft);border-bottom:1.5px dashed var(--clf-create)}
.clf.s-check .tag,.clf.s-contest .tag{background:var(--clf-create);color:#fff}
.clf.s-check.big .v,.clf.s-check.stat .v{text-decoration:underline dashed var(--clf-create) 2px;text-underline-offset:6px}
.clf.s-verified .tag{background:var(--clf-green-soft);color:var(--clf-green-ink)}
.clf.s-rejected,.clf.s-replaced{text-decoration:line-through;text-decoration-color:var(--clf-create);color:var(--clf-ink3)}
.clf.s-rejected .tag,.clf.s-replaced .tag{background:var(--clf-create-soft);color:var(--clf-create-ink)}
.clf.s-contest .split-v{display:inline-flex;align-items:baseline;gap:6px}
.clf.s-contest .split-v s{text-decoration:none;opacity:.55;font-weight:400}
.clf.s-contest.in{border-bottom:1.5px dashed var(--clf-create)}
.clf.low .tag.conf-l{background:var(--clf-amber-soft);color:var(--clf-amber-ink)}
.clf.conf.in,.clf.conf.claim{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--clf-ink) 7%,transparent) 5px 6px)}
.clf-cite{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:var(--clf-mono);font-size:10.5px;letter-spacing:.02em;color:var(--clf-ink3);border:1px solid var(--clf-line);border-radius:999px;padding:0 7px;line-height:17px;vertical-align:1px;white-space:nowrap;margin-left:2px}
.clf-cite:hover{border-color:var(--clf-ink3);color:var(--clf-ink)}
.clf-cite:focus-visible{outline:2px solid var(--clf-create);outline-offset:2px}
.clf-cite.s-check{border-color:var(--clf-create);color:var(--clf-create-ink)}
/* a value a person owns: text, edited in edit mode */
.clf.txt-f{display:inline;padding:0 2px;border-radius:4px}
.clf.txt-f.blk{display:block;padding:2px 4px;margin:-2px -4px}
.clf .org{font-family:var(--clf-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--clf-ink3);margin-left:5px;white-space:nowrap}
.clf .empty{color:var(--clf-ink3);font-style:italic}
.clf-editing .clf.editable{outline:1.5px dashed var(--clf-chart);outline-offset:2px;cursor:text}
.clf-editing .clf.editable::after{content:"✎";font-size:11px;color:var(--clf-chart);margin-left:4px}
.clf-editing .clf.correctable{outline:1.5px dashed color-mix(in srgb,var(--clf-chart) 55%,transparent);outline-offset:2px}
.clf-ed{display:grid;gap:10px;margin:4px 0;padding:12px;border:1.5px solid var(--clf-chart);border-radius:14px;background:var(--clf-paper)}
.clf-ed textarea,.clf-ed > input{font:inherit;font-size:15px;color:var(--clf-ink);background:var(--clf-paper);border:1px solid var(--clf-line);border-radius:8px;padding:6px 8px;width:100%}
.clf-ed textarea{min-height:70px;resize:vertical}
.clf-ed .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clf-ed .hint{font-size:13px;color:var(--clf-ink3)}
.clf-ed .clf-err{margin:0}
/* wording a person may rewrite (edit mode), anywhere a page marks it */
.clf-editing [data-clan-text]{outline:1.5px dashed color-mix(in srgb,var(--clf-chart) 60%,transparent);outline-offset:3px;border-radius:4px;cursor:text}
.clf-editing [data-clan-text]:hover{outline-color:var(--clf-chart)}
@keyframes clf-flash{0%,60%{outline-color:var(--clf-chart);background:color-mix(in srgb,var(--clf-chart) 14%,transparent)}100%{outline-color:transparent;background:transparent}}
.clf-flash{outline:2px solid transparent;outline-offset:3px;border-radius:4px;animation:clf-flash 2.2s ease-out}
[data-clan-text][contenteditable="true"]{outline:2px solid var(--clf-chart)!important;background:color-mix(in srgb,var(--clf-chart) 6%,transparent)}
.clf-edited{position:relative}
.clf-editing .clf-edited::before{content:"edited";position:absolute;top:-15px;right:0;font-family:var(--clf-mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--clf-green-ink)}
.clf-textbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;padding:12px;border:1.5px solid var(--clf-chart);border-radius:14px;background:var(--clf-paper);font-size:13.5px;color:var(--clf-ink2)}
.clf-textbar .clf-err{margin:0;width:100%}
.clf-textbar .note{flex:1 1 100%;font-size:13px;color:var(--clf-ink3)}
.clf-why{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.clf-why > b{flex:1 1 100%;font-size:15px;font-weight:600;color:var(--clf-ink)}
.clf-why input{flex:1 1 100%;min-width:0;min-height:44px;font:inherit;font-size:15px;color:var(--clf-ink);background:var(--clf-paper);border:1.5px solid var(--clf-line);border-radius:12px;padding:8px 14px}
.clf-why .chip{min-height:40px;border:1.5px solid var(--clf-line);background:var(--clf-paper);color:var(--clf-ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.clf-why .chip:hover{border-color:var(--clf-ink3)}
.clf-why .chip[aria-pressed="true"]{border-color:var(--clf-ink);background:var(--clf-ink);color:var(--clf-paper)}
.clf-missing{font-size:12.5px;font-style:italic;color:var(--clf-create-ink);border:1px dashed var(--clf-create);border-radius:6px;padding:0 6px}

/* ── a chart, a quote, a gap, the sources ────────────────────────────── */
.clf-chart{display:block;width:100%}
.clf-chart .eb{display:block;font-family:var(--clf-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--clf-ink3);margin-bottom:8px}
.clf-chart svg{display:block;width:100%;max-width:600px;height:auto;overflow:visible}
.clf-chart .mark{cursor:pointer}
.clf-chart .mark:focus{outline:none}
.clf-chart .mark:hover .bar,.clf-chart .mark:focus-visible .bar,.clf-chart .mark:hover circle,.clf-chart .mark:focus-visible circle{stroke:var(--clf-create);stroke-width:2}
.clf-chart .foot{font-family:var(--clf-mono);font-size:10.5px;color:var(--clf-ink3);margin-top:6px}
.clf-quote{all:unset;cursor:pointer;display:grid;gap:14px;border-radius:8px;color:inherit}
.clf-quote blockquote{margin:0;font-size:clamp(22px,3.2vw,34px);line-height:1.2;font-weight:700;letter-spacing:-.02em;max-width:28ch;text-wrap:balance}
.clf-quote blockquote::before{content:"\201C"}
.clf-quote blockquote::after{content:"\201D"}
.clf-quote .by{font-size:13px;color:var(--clf-ink2)}
.clf-gap{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px dashed var(--clf-line);border-radius:14px;padding:14px 16px;color:inherit}
.clf-gap .ic{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--clf-ink3);display:grid;place-items:center;font-family:var(--clf-mono);font-size:13px;color:var(--clf-ink3)}
.clf-gap b{display:block;font-size:14.5px}
.clf-gap span span{font-size:13px;color:var(--clf-ink2)}
.clf-sources{display:grid;gap:10px}
.clf-sources h2{font-size:14px;font-weight:700;margin:0}
.clf-sources ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.clf-srcrow{all:unset;cursor:pointer;display:grid;grid-template-columns:2.2ch 1fr auto;gap:10px;align-items:baseline;padding:6px 8px;margin:0 -8px;border-radius:8px;font-size:13.5px;color:inherit}
.clf-srcrow:hover{background:color-mix(in srgb,var(--clf-ink) 5%,transparent)}
.clf-srcrow .n{font-family:var(--clf-mono);font-size:11px;color:var(--clf-ink3)}
.clf-srcrow .m{font-size:12px;color:var(--clf-ink3);white-space:nowrap}
.clf-srcrow small{color:var(--clf-ink2);font-size:12.5px}
.clf-srcrow.more .n{visibility:hidden}

/* ── the tray: what needs a person, computed by the host ─────────────── */
.clf-tray{position:sticky;top:0;z-index:19;background:var(--clf-paper);border-bottom:1px solid var(--clf-line);box-shadow:0 1px 2px rgba(20,32,64,.06),0 8px 24px rgba(40,64,120,.07)}
.clf-tray-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clf-tray .who{display:flex;align-items:center;gap:10px;min-width:0}
.clf-tray .who .agent-figure{width:30px;height:40px}
.clf-tray .count{font-weight:700;font-size:14.5px;white-space:nowrap}
.clf-tray .count.zero{color:var(--clf-green-ink)}
.clf-tray .items{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 300px;min-width:0}
.clf-titem{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--clf-line);background:var(--clf-paper);border-radius:999px;padding:3px 10px 3px 8px;font:inherit;font-size:12.5px;cursor:pointer;max-width:100%;color:inherit}
.clf-titem:hover{border-color:var(--clf-create)}
.clf-titem .k{font-family:var(--clf-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--clf-create-ink);flex:none}
.clf-titem .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.clf-titem .off{font-size:11px;color:var(--clf-ink3);flex:none}
.clf-locked{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--clf-green-ink)}
.clf-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--clf-line);background:var(--clf-paper);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--clf-ink)}
.clf-btn:hover{border-color:var(--clf-ink3)}
.clf-btn.primary{background:var(--clf-ink);border-color:var(--clf-ink);color:var(--clf-paper)}
.clf-btn.danger{color:var(--clf-create-ink);border-color:color-mix(in srgb,var(--clf-create) 45%,var(--clf-line))}
.clf-btn[disabled]{opacity:.45;cursor:not-allowed}
.clf-btn .n{font-family:var(--clf-mono);font-size:11px;background:var(--clf-create);color:#fff;border-radius:999px;padding:0 6px}
/* An answer a person gives: big, plain, one tap. */
.clf-btn.big{min-height:48px;padding:12px 20px;font-size:15.5px;font-weight:600;border:1.5px solid var(--clf-ink);border-radius:14px;white-space:normal;text-align:left;justify-content:center}
.clf-btn.big:hover:not([disabled]){box-shadow:3px 3px 0 var(--clf-ink)}
.clf-btn.big.danger{border-color:var(--clf-create-ink)}
.clf-btn.quiet{border-color:var(--clf-line)}
.clf-btn:focus-visible{outline:2px solid var(--clf-create);outline-offset:2px}

/* ── the evidence drawer ─────────────────────────────────────────────── */
.clf-scrim{position:fixed;inset:0;background:rgba(10,12,16,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s var(--clf-ease)}
.clf-scrim.on{opacity:1;pointer-events:auto}
.clf-drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:41;background:var(--clf-paper);color:var(--clf-ink);box-shadow:0 2px 6px rgba(20,32,64,.08),0 24px 60px rgba(40,64,120,.18);transform:translateX(104%);transition:transform .28s var(--clf-ease);display:flex;flex-direction:column;font-size:14px;line-height:1.5}
.clf-drawer.on{transform:none}
.clf-dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--clf-line2)}
.clf-dh .crumb{flex:1;min-width:0;margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25;color:var(--clf-ink)}
.clf-ib{border:1px solid var(--clf-line);background:var(--clf-paper);color:var(--clf-ink);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.clf-ib:focus-visible{outline:2px solid var(--clf-create);outline-offset:2px}
.clf-ib[hidden]{display:none}
.clf-db{overflow:auto;padding:20px 20px 28px;display:grid;gap:20px;align-content:start}
.clf-dv{display:grid;gap:6px}
.clf-dv .v{font-size:clamp(40px,11vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.clf-dv .stmt{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.clf-dv .c{font-size:15px;color:var(--clf-ink2)}
.clf-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--clf-soft);color:var(--clf-ink2);width:max-content;max-width:100%}
.clf-pill.check{background:var(--clf-create-soft);color:var(--clf-create-ink)}
.clf-pill.ok{background:var(--clf-green-soft);color:var(--clf-green-ink)}
.clf-pill.warn{background:var(--clf-amber-soft);color:var(--clf-amber-ink)}
.clf-pill.conf{background:var(--clf-soft);color:var(--clf-ink);border:1px dashed var(--clf-ink3)}
.clf-pills{display:flex;flex-wrap:wrap;gap:6px}
.clf-sec{display:grid;gap:8px}
.clf-sec > h3{font-size:15px;font-weight:700;color:var(--clf-ink);margin:0}
.clf-sec > h3.ask{font-size:19px;letter-spacing:-.01em}
.clf-q{margin:0;padding:14px 16px 14px 18px;background:var(--clf-soft);border-left:3px solid var(--clf-ink3);border-radius:4px 12px 12px 4px;font-size:16px;line-height:1.5}
.clf-q.said::before{content:"\201C"}
.clf-q.said::after{content:"\201D"}
.clf-q mark{background:color-mix(in srgb,var(--clf-amber) 40%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.clf-by{margin:0;font-size:14px;color:var(--clf-ink2);overflow-wrap:anywhere}
.clf-by b{font-weight:600;color:var(--clf-ink)}
.clf-by a{color:var(--clf-chart);font-weight:500;text-decoration:none;white-space:nowrap}
.clf-by a:hover{text-decoration:underline}
/* The agent that recorded a thing says so, in its own words and signed. */
.clf-say-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.clf-say-row .agent-figure{width:40px;height:53px}
.clf-say{position:relative;margin:0 0 14px;background:var(--clf-paper);border:1.5px solid var(--clf-ink);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.4;box-shadow:3px 3px 0 var(--clf-ink);color:var(--clf-ink)}
.clf-say::after{content:"";position:absolute;left:-8px;bottom:12px;width:12px;height:12px;background:var(--clf-paper);border-left:1.5px solid var(--clf-ink);border-bottom:1.5px solid var(--clf-ink);transform:rotate(45deg)}
.clf-say .who{display:block;font-family:var(--clf-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--clf-ink3);margin-bottom:2px}
.clf-say p{margin:0}
.clf-answers{display:grid;gap:10px}
.clf-ex{margin:0;font-size:13.5px;line-height:1.45;color:var(--clf-ink2)}
.clf-more{font-size:13px;color:var(--clf-ink3)}
.clf-more > summary{cursor:pointer;min-height:36px;display:flex;align-items:center;gap:6px;list-style:none;color:var(--clf-ink2);font-weight:500}
.clf-more > summary::-webkit-details-marker{display:none}
.clf-more > summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin:0 4px 0 2px;flex:none}
.clf-more[open] > summary::before{transform:rotate(45deg)}
.clf-more > summary:focus-visible{outline:2px solid var(--clf-create);outline-offset:2px;border-radius:6px}
.clf-more[open] > summary{margin-bottom:8px}
.clf-card{border:1px solid var(--clf-line2);border-radius:12px;padding:14px;display:grid;gap:8px}
.clf-card .t{font-weight:600;font-size:14.5px;line-height:1.3}
.clf-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.clf-card dt{color:var(--clf-ink3)}
.clf-card dd{margin:0;color:var(--clf-ink2);overflow-wrap:anywhere}
.clf-card a{color:var(--clf-chart);font-size:13px;font-weight:500;text-decoration:none;width:max-content}
.clf-card a:hover{text-decoration:underline}
.clf-rows{display:grid;gap:6px}
.clf-row{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;min-height:44px;box-sizing:border-box;padding:10px 14px;border:1px solid var(--clf-line);border-radius:12px;font-size:14.5px;color:inherit}
.clf-row:hover{border-color:var(--clf-ink3)}
.clf-row:focus-visible{outline:2px solid var(--clf-create);outline-offset:2px}
.clf-row b{font-variant-numeric:tabular-nums}
.clf-row small{display:block;color:var(--clf-ink3);font-size:13px}
.clf-acts{display:flex;flex-wrap:wrap;gap:10px}
.clf-form{display:grid;gap:14px;padding:16px;border:1.5px solid var(--clf-line);border-radius:14px}
.clf-form.bare{border:0;padding:0}
.clf-form > b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.clf-form label{display:grid;gap:6px;font-size:15px;font-weight:600;color:var(--clf-ink)}
.clf-form textarea,.clf-form input[type="text"],.clf-form input[type="url"]{font:inherit;font-size:15px;font-weight:400;color:var(--clf-ink);background:var(--clf-paper);border:1.5px solid var(--clf-line);border-radius:12px;padding:10px 12px;min-height:48px;box-sizing:border-box;width:100%}
.clf-form textarea{min-height:76px;resize:vertical}
.clf-form .req{color:var(--clf-create-ink);font-size:13px;font-weight:500}
.clf-form .opt{color:var(--clf-ink3);font-size:13px;font-weight:400}
/* One button per value: the radio is there for the form, the label is what a person taps. */
.clf-opt{position:relative;display:grid;gap:6px;padding:14px 16px;border:1.5px solid var(--clf-ink);border-radius:14px;cursor:pointer;background:var(--clf-paper)}
.clf-opt:hover{box-shadow:3px 3px 0 var(--clf-ink)}
.clf-opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.clf-opt:focus-within{outline:2px solid var(--clf-create);outline-offset:2px}
.clf-opt:has(input:checked){background:var(--clf-ink);color:var(--clf-paper)}
.clf-opt:has(input:checked) .q,.clf-opt:has(input:checked) .s{color:inherit;opacity:.85}
.clf-opt .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clf-opt .v.long{font-size:17px;font-weight:700;line-height:1.35;letter-spacing:-.005em}
.clf-opt .q{font-size:14.5px;font-weight:400;color:var(--clf-ink2)}
.clf-opt .s{font-size:13.5px;font-weight:400;color:var(--clf-ink3)}
.clf-then{display:none;gap:14px}
.clf-form:has(input[name="pick"]:checked) .clf-then{display:grid}
.clf-form .clf-toggle{display:flex;align-items:start;gap:12px;font-size:15px;font-weight:500;color:var(--clf-ink);cursor:pointer;min-height:44px}
.clf-toggle small{display:block;color:var(--clf-ink3);font-size:13px;font-weight:400}
.clf-toggle input{margin-top:2px;width:22px;height:22px;flex:none;accent-color:var(--clf-ink)}
.clf-hist{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;color:var(--clf-ink2)}
.clf-hist li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.clf-hist li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--clf-ink3);margin-top:7px}
.clf-err{font-size:14px;color:var(--clf-create-ink);background:var(--clf-create-soft);border-radius:10px;padding:8px 12px}
.clf-muted{color:var(--clf-ink3);font-size:13.5px;margin:0}
.clf-toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--clf-ink);color:var(--clf-paper);padding:12px 20px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:all .25s var(--clf-ease);z-index:60;max-width:calc(100% - 32px)}
.clf-toast.on{opacity:1;transform:translate(-50%,0)}

/* ── the layout vocabulary an agent composes a report from ───────────── */
.cl-report{background:var(--clf-paper);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(20,32,64,.06),0 8px 24px rgba(40,64,120,.07)}
.cl-head{padding:48px clamp(20px,5vw,64px) 36px;display:grid;gap:14px;border-bottom:1px solid var(--clf-line2)}

.cl-dek{font-size:17px;color:var(--clf-ink2);max-width:60ch;margin:0}
.cl-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border-bottom:1px solid var(--clf-line2);padding-inline:calc(clamp(20px,5vw,64px) - clamp(12px,2vw,24px))}

.cl-nums > :first-child{border-left:0}

.cl-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,4vw,48px);align-items:start}
.cl-prose{display:grid;gap:14px;align-content:start}
.cl-prose p,.cl-block > p{margin:0;max-width:62ch;font-size:16px;line-height:1.55}
.cl-report h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}

.cl-label{margin:0;font-family:var(--clf-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--clf-ink3);font-weight:500}
.cl-figure{display:grid;gap:10px;align-content:start}
.cl-cap{font-size:12.5px;color:var(--clf-ink3)}
.cl-band{padding:44px clamp(20px,5vw,64px);background:var(--clf-ink);color:var(--clf-paper);--ink:var(--clf-paper);--ink2:color-mix(in srgb,var(--clf-paper) 72%,transparent);--ink3:color-mix(in srgb,var(--clf-paper) 55%,transparent);--line:color-mix(in srgb,var(--clf-paper) 22%,transparent);--line-soft:color-mix(in srgb,var(--clf-paper) 14%,transparent);--paper:var(--clf-ink)}

.cl-block{padding:40px clamp(20px,5vw,64px);display:grid;gap:18px;border-top:1px solid var(--clf-line2)}
.cl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cl-grid > *{padding:24px clamp(20px,4vw,44px);display:grid;gap:12px;align-content:start}
.cl-grid > * + *{border-left:1px solid var(--clf-line2)}
.cl-callout{border:1px dashed var(--clf-line);border-radius:16px;padding:20px;display:grid;gap:14px}
.cl-row{display:flex;flex-wrap:wrap;gap:28px}
.cl-table{width:100%;border-collapse:collapse;font-size:14px}
.cl-table td,.cl-table th{padding:9px 0;border-bottom:1px solid var(--clf-line2);vertical-align:top;text-align:left;font-weight:400}
.cl-table td:first-child,.cl-table th:first-child{color:var(--clf-ink2);padding-right:12px}
.cl-table td:last-child{text-align:right}
.cl-list{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:m}
.cl-list > li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:15px}
.cl-list > li::before{counter-increment:m;content:counter(m);font-family:var(--clf-mono);font-size:12px;color:var(--clf-ink3);padding-top:2px}
.cl-foot{padding:32px clamp(20px,5vw,64px) 40px;border-top:1px solid var(--clf-line2);background:var(--clf-soft)}
@media (max-width:860px){.cl-cols,.cl-split,.cl-grid{grid-template-columns:minmax(0,1fr)}.cl-grid > * + *{border-left:0;border-top:1px solid var(--clf-line2)}}
/* On a phone a long publisher breaks rather than push the column past the card. */
@media (max-width:620px){.clf-drawer{top:auto;height:88%;width:100%;border-radius:18px 18px 0 0;transform:translateY(104%)}.clf-titem .x{max-width:170px}.clf-src{white-space:normal;overflow-wrap:anywhere}
  .clf-db{padding:16px 16px 24px}.clf-acts > .clf-btn.big,.clf-textbar > .clf-btn,.clf-ed .row > .clf-btn{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){.clf-drawer,.clf-scrim,.clf-toast,.clf{transition:none}}

<script>
/* The OS's fields. Everything a field shows comes from the record the host

  var SCHEME=(navigator.userAgent.indexOf('Windows')!==-1)?'http://clan.localhost':'clan://localhost';

  function gaps(){ return arr(obj(data().selection).gaps); }

  function gap(id){ return gaps().filter(function(g){ return g.id===id; })[0]||null; }
  function edits(){ return obj((window.__CLAN__||{}).edits); }
  function docId(){ var m=obj((window.__CLAN__||{}).manifest); return m.document_id||m.id||''; }

  // for when the crew read it. What is not a date is shown as it is.

  var MON=['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];

  function dayMonth(d,time){ var p=dparts(d); if(!p||!p.d) return monthYear(d);

  // "Shelflife Magazine, 2026") reads as one: the first spelling, without the
  // year. Display only; the records keep what they say.

  }
  function uniqNames(list){ var seen={}, out=[]; list.forEach(function(n){ var k=pubKey(n)||String(n); if(n&&!seen[k]){ seen[k]=1; out.push(pubName(n)||n); } }); return out; }
  function andList(xs){ return xs.length<2?(xs[0]||''):xs.slice(0,-1).join(', ')+' and '+xs[xs.length-1]; }

  // ── values and labels ───────────────────────────────────────────────

  function whoOfSrc(rec){ return /^human:/.test(rec.uri||'')?rec.uri:'human:'+(rec.publisher||'someone'); }

  // wholly as letter codes (a name in another script) is spelt out again.

  // ── who in the crew recorded a thing ────────────────────────────────
  // The agent that made the newest decision on the path, as the crew names it
  // (the judge checks things and never records them, so it is passed over);
  // failing that, the researcher whose lens the key's namespace names (the

  var NS_EXTRA={share:'market_structure',awareness:'brands_positioning',launch:'brands_positioning',product:'brands_positioning'};
  function crew(){ return typeof NapkinAgents==='object'&&NapkinAgents?NapkinAgents:null; }
  function lensOfKey(key){

    var A=crew(), ns=String(key||'').split(':').pop().split('.')[0]; if(!A||!ns) return '';

  function agentOf(path,key,work){

  // A figure by agent key, through the crew's own work names.

    var ws=['read','synthesise','draft','judge'];
    for(var i=0;i<ws.length;i++) if(A.forWork(ws[i])===k) return A.figure(ws[i],o);
    var l=arr(A.lenses).filter(function(x){ return A.forWork('research',x)===k; })[0];

  // The agent says it, in first person, signed by name.
  function say(k,text,state){

  function givenOf(k){ var A=crew(); return A&&A.given[k]||''; }

  function openContestOf(fid){ return contests().filter(function(c){ return c.status==='open'&&arr(c.values).some(function(v){ return v.fact_id===fid; }); })[0]||null; }

    } else if(k==='path'){
      var env=envAt(ref), v=valueAt(ref);
      b+='<div class="clf-dv"><span class="stmt">'+(textOf(v)?esc(textOf(v)):'<span class="clf-muted">Nothing here yet</span>')+'</span>'+(env?'<div class="clf-pills"><span class="clf-pill">'+esc(ORIGIN[env.origin]||env.origin)+'</span></div>':'')+'</div>';
      if(env&&env.source&&env.source.quote) b+='<div class="clf-sec"><h3>What your material says</h3><blockquote class="clf-q said">'+esc(env.source.quote)+'</blockquote></div>';
      if(env&&arr(env.fact_ids).length) b+='<div class="clf-sec"><h3>Worked out from</h3><div class="clf-rows">'+arr(env.fact_ids).map(function(c){ var p=pins()[c]; return '<button type="button" class="clf-row" data-open="'+esc(c)+'"><span>'+esc(p?label(p):'A fact')+'</span><b>'+esc(fmt(p))+'</b></button>'; }).join('')+'</div></div>';
      if(!L&&editableValue(v)) b+='<p class="clf-muted">To change it, press <b>Edit</b> at the top, then tap it.</p>';
      b+=history(ref);
    } else if(k==='cite'){
      b+='<div class="clf-rows">'+ref.slice(5).split(',').map(function(r){ var kk=kindOf(r), t='', v='';
        if(kk==='pin'){ var p=pins()[r]; t=p?label(p):'A fact'; v=fmt(p); }
        else if(kk==='finding'){ var f=findings()[r]||{}; t=f.statement||'A point the crew worked out'; v=STATUS_WORD[f.status]||''; }
        else if(kk==='contest'){ t=named(r); v=stateOf(r)==='contest'?'sources disagree':'picked'; }
        return '<button type="button" class="clf-row" data-open="'+esc(r)+'"><span>'+esc(t)+'</span><b>'+esc(v)+'</b></button>'; }).join('')+'</div>';
    } else if(k==='source'){
      crumb='About this source'; var used=Object.keys(pins()).filter(function(x){ return arr(pins()[x].sources).indexOf(ref)!==-1; });
      b+=srcCard(ref,null,true)+'<div class="clf-sec"><h3>What we took from it ('+used.length+')</h3><div class="clf-rows">'+used.map(function(x){ var p=pins()[x]; return '<button type="button" class="clf-row" data-open="'+esc(x)+'"><span>'+esc(label(p))+'</span><b>'+esc(fmt(p))+'</b></button>'; }).join('')+'</div></div>';
    } else {
      crumb='Needs a person'; if(!t.note) b+='<p class="clf-muted">This needs a person to look at it.</p>';
    }
    if(k&&k!=='source'&&k!=='cite') b+=wrote(ref);
    DRAWER.crumb.textContent=crumb; DRAWER.body.innerHTML=b;
  }
  function showError(form,msg){ var e=form&&form.querySelector('.clf-err'); if(e){ e.textContent=msg; e.hidden=false; } else toast(msg); }
  function act(route,body,form,done){
    var btns=form?form.querySelectorAll('button'):[]; Array.prototype.forEach.call(btns,function(x){ x.disabled=true; });
    return post(route,body).then(function(res){
      Array.prototype.forEach.call(btns,function(x){ x.disabled=false; });
      var err=errorOf(res); if(err&&!(res&&res.ok)){ showError(form,err); return; }
      return loadView().then(function(){ refresh(); if(STACK.length) draw(); toast(done); });
    },function(){ showError(form,OFFLINE); Array.prototype.forEach.call(btns,function(x){ x.disabled=false; }); });
  }
  function onDrawerClick(e){
    // App frames are sandboxed without allow-forms, so a form never submits:
    // a submit button acts on its click, in every frame alike.
    var sb=e.target.closest('button[type="submit"]'), sf=sb&&sb.closest('form[data-clf-form]');
    if(sf){ e.preventDefault(); onDrawerSubmit({preventDefault:function(){}, target:sf, submitter:sb}); return; }
    var o=e.target.closest('[data-open]'); if(o){ open(o.getAttribute('data-open'),true); return; }
    var a=e.target.closest('[data-clf]'); if(!a) return; var w=a.getAttribute('data-clf'), ref=top().ref, k=kindOf(ref);
    var target=(k==='pin'?'facts[':'findings[')+ref+']';
    if(w==='close') close();
    else if(w==='back'){ STACK.pop(); draw(); }
    else if(w==='redraw') draw();
    else if(w==='fix'){ top().fix=true; draw(); var inp=DRAWER.body.querySelector('form[data-clf-form="correct"] input[name="value"]'); if(inp) inp.focus(); }
    else if(w==='good') act('/verdict',{target:target,polarity:'good',rationale:''},null,'Thanks. Saved as right.');
    else if(w==='bad'||w==='conf'){
      var box=document.createElement('div');
      box.innerHTML=w==='conf'?confForm(ref,target):badForm(target);
      var anchor=DRAWER.body.querySelector('[data-clf-anchor]'); if(anchor) anchor.replaceWith(box.firstChild); else DRAWER.body.appendChild(box.firstChild);
      var first=DRAWER.body.querySelector('form[data-clf-form="'+(w==='conf'?'classify':'bad')+'"] textarea'); if(first&&w==='bad') first.focus();
    }
  }
  function onDrawerSubmit(e){
    e.preventDefault(); var form=e.target, kind=form.getAttribute('data-clf-form'), ref=top().ref, fd=new FormData(form), why=String(fd.get('why')||'').trim();
    if(kind==='finding'){
      var v=e.submitter&&e.submitter.value;
      if(v==='reject'){ if(!why){ showError(form,'Say what is wrong, so the agent can fix it.'); return; }
        act('/verdict',{target:'findings['+ref+']',polarity:'bad',rationale:why},form,'Thanks. Saved as wrong.'); }
      else act('/verify',{finding:ref,rationale:why},form,'Thanks. Saved to the agency\u2019s shared memory.');
    } else if(kind==='resolve'){ if(!fd.get('pick')){ showError(form,'Pick one first.'); return; } if(!why){ showError(form,'Say why you picked this one.'); return; }
      act('/resolve',{contest:ref,chosen:fd.get('pick'),rationale:why},form,'Saved. The report uses your pick.'); }
    else if(kind==='correct'){ if(!String(fd.get('value')||'').trim()){ showError(form,'Write the right value.'); return; } if(!why){ showError(form,'Say why the old one is wrong.'); return; }
      top().fix=false; act('/correct',{fact:ref,value:String(fd.get('value')).trim(),source_uri:String(fd.get('src')||'').trim(),rationale:why},form,'Saved. The old value is kept on record.'); }
    else if(!why){ showError(form,kind==='bad'?'Say what is wrong, so it can be fixed.':'Say why, in a few words.'); return; }
    else if(kind==='classify') act('/classify',{target:form.getAttribute('data-target'),model:fd.get('model')==='on',export:fd.get('export')==='on',corpus:fd.get('corpus')==='on',rationale:why},form,'Saved. It is kept private.');
    else if(kind==='bad') act('/verdict',{target:form.getAttribute('data-target'),polarity:'bad',rationale:why},form,'Thanks. Saved as wrong.');
  }

  // ── agent-written layouts ───────────────────────────────────────────
  // What an agent may write: the layout vocabulary (cl-* classes), text, and
  // the clan-* elements. No script, no style, no link, no event handler, no
  // element or attribute outside these lists; what is dropped is dropped whole.
  var TAGS={SECTION:1,DIV:1,HEADER:1,FOOTER:1,ARTICLE:1,ASIDE:1,H1:1,H2:1,H3:1,P:1,SPAN:1,STRONG:1,EM:1,B:1,I:1,SMALL:1,BR:1,HR:1,OL:1,UL:1,LI:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TD:1,TH:1,FIGURE:1,FIGCAPTION:1,BLOCKQUOTE:1,
    'CLAN-FIELD':1,'CLAN-CITE':1,'CLAN-CHART':1,'CLAN-QUOTE':1,'CLAN-GAP':1,'CLAN-SOURCES':1,'CLAN-TRAY':1};
  var ATTRS={'class':1,ref:1,refs:1,as:1,caption:1,kind:1,title:1,rest:1,labels:1,source:1,compact:1,colspan:1,rowspan:1,'data-tone':1};
  function clean(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(n){
      if(n.nodeType===3) return;
      if(n.nodeType!==1||!TAGS[n.tagName]){ n.remove(); return; }
      Array.prototype.slice.call(n.attributes).forEach(function(a){
        var name=a.name.toLowerCase();
        if(!ATTRS[name]) n.removeAttribute(a.name);
        else if(name==='class') n.setAttribute('class',a.value.split(/\s+/).filter(function(c){ return /^cl-[a-z0-9-]+$|^compact$/.test(c); }).join(' '));
      });
      clean(n);
    });
    return node;
  }
  function layout(html){ var t=document.createElement('template'); t.innerHTML=String(html||''); return clean(t.content); }
  function mount(el,html){ el.textContent=''; el.appendChild(layout(html)); stampTexts(el,'report:'+hash(String(html||''))); refresh(); }

  // ── wording a person may rewrite ──────────────────────────────────
  // Any element marked data-clan-text="<key>" shows the person's wording for
  // that key when there is one, and is editable in edit mode. A layout's text
  // blocks are marked when it is mounted, keyed by the layout itself.
  var TEXT_BLOCKS='h1,h2,h3,p,li,blockquote,figcaption,td,th,.cl-eyebrow,.cl-dek,.cl-cap,.cl-label';
  function hash(str){ var h=5381; for(var i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36); }
  function stampTexts(root, prefix){
    var n=0;
    Array.prototype.forEach.call(root.querySelectorAll(TEXT_BLOCKS),function(el){
      if(el.closest('clan-field,clan-chart,clan-quote,clan-gap,clan-sources,clan-cite,clan-tray')) return;
      if(el.querySelector(TEXT_BLOCKS)) return; // the innermost block is the text
      if(!el.textContent.trim()&&!el.querySelector('clan-field,clan-cite')) return;
      n++; if(!el.hasAttribute('data-clan-text')) el.setAttribute('data-clan-text', prefix+':b'+n);
    });
  }
  // Every edit says why: typed, or one of the usual reasons.
  var WHY_CHIPS=['Clearer wording','Fix a mistake','The client\u2019s words','Newer information'];
  function whyRow(){ return '<div class="clf-why" role="group" aria-label="Why are you changing this?"><b aria-hidden="true">Why are you changing this?</b>'
    +WHY_CHIPS.map(function(c){ return '<button type="button" class="chip" data-chip aria-pressed="false">'+esc(c)+'</button>'; }).join('')
    +'<input type="text" data-why placeholder="Or say it in your own words" aria-label="Why are you changing this?"></div>'; }
  // A tapped reason fills the box and shows as picked; typing unpicks it.
  function wireWhy(box){
    var i=box.querySelector('[data-why]');
    function mark(){ Array.prototype.forEach.call(box.querySelectorAll('[data-chip]'),function(c){ c.setAttribute('aria-pressed',String(c.textContent===i.value.trim())); }); }
    box.addEventListener('click',function(e){ var c=e.target.closest('[data-chip]'); if(!c) return; i.value=c.textContent; mark(); });
    i.addEventListener('input',mark);
  }
  var PART={H1:'headline',H2:'heading',H3:'heading',P:'paragraph',LI:'list item',BLOCKQUOTE:'quote',FIGCAPTION:'caption',TD:'table cell',TH:'table heading'};
  function partOf(el){ return PART[el.tagName]||(el.classList.contains('cl-dek')?'standfirst':el.classList.contains('cl-eyebrow')?'label':el.classList.contains('cl-cap')?'caption':'text'); }
  function cleanHtml(h){ var d=document.createElement('div'); d.appendChild(layout(h)); return d.innerHTML; }
  function applyTexts(){
    var E=edits();
    Array.prototype.forEach.call(document.querySelectorAll('[data-clan-text]'),function(el){
      if(el.__clfEditing) return;
      if(el.__clfOrig===undefined) el.__clfOrig=el.innerHTML;
      var want=E[el.getAttribute('data-clan-text')];
      if(typeof want==='string'&&want){
        if(el.__clfShown!==want){ el.innerHTML=cleanHtml(want); el.__clfShown=want; }
        el.classList.add('clf-edited'); el.title='Edited by a person';
      } else if(el.__clfShown!=null){
        el.innerHTML=el.__clfOrig; el.__clfShown=null; el.classList.remove('clf-edited'); el.removeAttribute('title');
      }
    });
  }
  function wordsOf(el){
    var c=el.cloneNode(true);
    Array.prototype.forEach.call(c.querySelectorAll('clan-field,clan-cite,clan-chart,clan-quote,clan-gap,clan-sources'),function(x){ x.innerHTML=''; x.removeAttribute('contenteditable'); });
    Array.prototype.forEach.call(c.querySelectorAll('[contenteditable]'),function(x){ x.removeAttribute('contenteditable'); });
    return c.innerHTML.replace(/&nbsp;/g,' ').trim();
  }
  function editText(el){
    if(el.__clfEditing) return;
    el.__clfEditing=true;
    var before=el.innerHTML, key=el.getAttribute('data-clan-text'), was=wordsOf(el);
    Array.prototype.forEach.call(el.querySelectorAll('clan-field,clan-cite,clan-chart,clan-quote,clan-gap'),function(x){ x.setAttribute('contenteditable','false'); });
    el.setAttribute('contenteditable','true'); el.focus();
    var bar=document.createElement('div'); bar.className='clf-textbar';
    bar.innerHTML=whyRow()+'<div class="clf-err" hidden></div><button type="button" class="clf-btn big primary" data-t="save">Save</button><button type="button" class="clf-btn big quiet" data-t="cancel">Cancel</button>'
      +(el.classList.contains('clf-edited')?'<button type="button" class="clf-btn big quiet" data-t="restore">Put back what the agent wrote</button>':'')
      +'<span class="note">Your words are kept as your decision. The numbers in them stay up to date.</span>';
    el.insertAdjacentElement('afterend',bar); wireWhy(bar);
    var wasText=el.textContent.replace(/\s+/g,' ').trim();
    function stop(){ el.removeAttribute('contenteditable'); el.__clfEditing=false; bar.remove(); refresh(); }
    function fail(m){ var e=bar.querySelector('.clf-err'); e.textContent=m; e.hidden=false; Array.prototype.forEach.call(bar.querySelectorAll('button'),function(b){ b.disabled=false; }); }
    function send(html, done){
      Array.prototype.forEach.call(bar.querySelectorAll('button'),function(b){ b.disabled=true; });
      post('/edit-text',{key:key, html:html, rationale:String((bar.querySelector('[data-why]')||{}).value||'').trim(), part:partOf(el), was:wasText}).then(function(res){
        if(res&&res.ok){ loadView(); done(); toast(html?'Saved':'The agent\u2019s words are back'); return; }
        fail('That did not save. '+(errorOf(res)||'Please try again.'));
      },function(){ fail(OFFLINE); });
    }
    bar.addEventListener('click',function(e){
      var t=e.target.closest('[data-t]'); if(!t) return; var w=t.getAttribute('data-t');
      if(w==='cancel'){ el.innerHTML=before; stop(); }
      else if(w==='save'){ var now=wordsOf(el); if(now===was){ stop(); return; } if(!el.textContent.trim()){ fail('Write something, or press Cancel.'); return; }
        if(!String(bar.querySelector('[data-why]').value||'').trim()){ fail('Say why you are changing it: tap a reason or type one.'); bar.querySelector('[data-why]').focus(); return; }
        send(now,function(){ el.__clfShown=now; stop(); }); }
      else if(w==='restore'){ send('',function(){ el.__clfShown=''; el.innerHTML=el.__clfOrig; el.__clfShown=null; el.classList.remove('clf-edited'); stop(); }); }
    });
    el.addEventListener('keydown',function onKey(e){
      if(!el.__clfEditing){ el.removeEventListener('keydown',onKey); return; }
      if(e.key==='Escape'){ e.preventDefault(); bar.querySelector('[data-t="cancel"]').click(); }
      else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey||/^H[1-3]$/.test(el.tagName))){ e.preventDefault(); bar.querySelector('[data-t="save"]').click(); }
    });
    el.addEventListener('paste',function(e){ if(!el.__clfEditing) return; e.preventDefault(); var t=(e.clipboardData||window.clipboardData).getData('text/plain'); document.execCommand('insertText',false,t); });
  }

  // ── wiring ──────────────────────────────────────────────────────────
  // One element that cannot render shows as missing; it never stops the rest.
  function each(sel,fn){
    Array.prototype.forEach.call(document.querySelectorAll(sel),function(el){
      try{ fn(el); }catch(e){ el.innerHTML=missing('This part could not be shown'); if(window.console) console.error(el.tagName.toLowerCase(),el.getAttribute('ref')||el.getAttribute('refs')||'',e); }
    });
  }
  function refresh(){
    applyTexts();
    each('clan-field',renderField); each('clan-cite',renderCite); each('clan-chart',renderChart);
    each('clan-quote',renderQuote); each('clan-gap',renderGap); each('clan-sources',renderSources); each('clan-tray',renderTray);
  }
  document.addEventListener('click',function(e){
    if(DRAWER&&DRAWER.el.contains(e.target)) return;
    if(EDIT&&!locked()){
      var tx=e.target.closest('[data-clan-text]');
      if(tx&&tx.__clfEditing&&!e.target.closest('[data-ref]')) return; // typing
      if(tx&&!e.target.closest('[data-ref]')&&!e.target.closest('.clf-textbar')){ e.preventDefault(); editText(tx); return; }
    }
    if(e.target.closest('[data-clf-lock]')){ act('/approve',{},null,'The report is locked. This version is the final one.'); return; }
    var t=e.target.closest('[data-ref]'); if(!t) return;
    if(!t.closest('clan-field,clan-cite,clan-chart,clan-quote,clan-gap,clan-sources,clan-tray')) return;
    var ref=t.getAttribute('data-ref');
    if(EDIT&&!locked()&&t.classList.contains('editable')&&kindOf(ref)==='path'){ editPath(t.closest('clan-field'), ref); return; }
    if(EDIT&&!locked()&&kindOf(ref)==='pin'&&t.classList.contains('correctable')){ open(ref); top().fix=true; draw(); return; }
    if(t.classList.contains('clf-titem')){ var el=document.querySelector('[data-ref="'+cssEsc(ref)+'"]:not(.clf-titem)'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'center',behavior:'smooth'}); open(ref,false,kindOf(ref)?'':t.getAttribute('data-note')); return; }
    open(ref);
  });
  document.addEventListener('keydown',function(e){ var m=e.target.closest&&e.target.closest('.clf-chart .mark'); if(m&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); open(m.getAttribute('data-ref')); } });
  window.addEventListener('clan:dataupdated',function(){ loadView().then(refresh); });
  // Edit mode is the OS's (the toolbar's Edit); the bridge announces it.
  window.addEventListener('clan:editmode',function(e){
    EDIT=!!(e.detail&&e.detail.active);
    document.documentElement.classList.toggle('clf-editing',EDIT);
    // Leaving edit mode closes every editor still open; what was not saved
    // is put back as it was.
    if(!EDIT){
      Array.prototype.forEach.call(document.querySelectorAll('.clf-textbar [data-t="cancel"],[data-clf-cancel]'),function(b){ b.click(); });
      Array.prototype.forEach.call(document.querySelectorAll('[data-clan-text][contenteditable]'),function(x){ x.removeAttribute('contenteditable'); x.__clfEditing=false; });
    }
    refresh();
  });
  // The OS's decision panel asks to show one thing: a pin, finding, contest,
  // gap or source opens its evidence; a data path is the app's to show
  // (`clan:focus`). Only the shell above this frame may ask.
  window.addEventListener('message',function(e){
    var m=e.data; if(e.source!==window.parent||!m||m.type!=='clan:open') return;
    var ref=String(m.ref||'');
    // A piece of the page's wording (`text[<key>]`): scroll to it and mark it.
    var tk=/^text\[(.+)\]$/.exec(ref);
    if(tk){
      var tx=document.querySelector('[data-clan-text="'+cssEsc(tk[1])+'"]');
      if(!tx){ toast('That wording is no longer on the page'); return; }
      if(tx.scrollIntoView) tx.scrollIntoView({block:'center',behavior:'smooth'});
      tx.classList.remove('clf-flash'); void tx.offsetWidth; tx.classList.add('clf-flash');
      setTimeout(function(){ tx.classList.remove('clf-flash'); },2200);
      return;
    }
    var el=ref&&document.querySelector('[data-ref="'+cssEsc(ref)+'"]:not(.clf-titem)');
    if(el&&el.scrollIntoView) el.scrollIntoView({block:'center',behavior:'smooth'});
    if(kindOf(ref)) open(ref);
    else window.dispatchEvent(new CustomEvent('clan:focus',{detail:{path:m.path||ref}}));
  });
  function start(){ loadView().then(refresh); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();

  return {refresh:refresh, reload:function(){ return loadView().then(refresh); }, open:open, layout:layout, mount:mount,
          format:fmt, label:label, kindOf:kindOf, stateOf:stateOf,
          // The host's decision view as last read (null until it is), and the lock.
          view:function(){ return VIEW; }, locked:lockDecision};
})();
</script>
