# Capability requirements (CLAN spec §22) for the Brief Maker application.
# This file travels verbatim into every app instantiated from this template,
# so any orchestrator opening a Brief Maker .clan can check capability fit.
#
# The app does no inference of its own. Drafting and redrafting — draft_brief,
# regenerate_field and polling them with job_status — go through ONE
# capability: the host's `clan://api-proxy` with `request_kind: middleware`,
# speaking the `napkin.middleware/1` envelope (docs/contracts/middleware-api.md
# §10). The tasks and their handlers are declared in app/pipeline.yaml; the
# model, retrieval and the Judge's rubric are the middleware's concern, never
# the document's.
#
# Orchestrators SHOULD warn, not fail: without the middleware the brief is
# still a complete, editable record — every field, its decisions and verdicts
# render, and a person can write or edit any of them. It just cannot draft.
requires:
  tools:
    - name: middleware
      why: "the briefing pipeline (app/pipeline.yaml): capture the client's words from the prompt and attachments, draft the strategy fields in parallel, and judge the brief — over request_kind middleware, envelope napkin.middleware/1. Both tasks are long jobs the host polls with job_status."
