[package]
name = "clan-app"
version.workspace = true
edition = "2021"
rust-version = "1.74"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Every host behaviour lives here; this crate is the Tauri adapter around it.
napkin-host = { path = "../../crates/napkin-host" }
