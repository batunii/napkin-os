# Local run of the same image a host would run.
#
#   docker compose up --build
#
# No API key: visitors bring their own and their browser makes the call.
# Documents live in the named volume, so they survive a rebuild.
services:
  napkin:
    build:
      context: .
      args:
        WITH_PDF: "1"       # "0" drops Chromium (~400 MB); HTML export still works
    ports:
      - "8080:8080"
    environment:
      # Set when you put TLS in front of this.
      # NAPKIN_WEB_SECURE_COOKIE: "1"
    volumes:
      - napkin-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /api/healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  napkin-data:
