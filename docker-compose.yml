# Local run of the same image a host would run.
#
#   ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
#
# Documents live in the named volume, so they survive a rebuild.
services:
  napkin:
    build:
      context: .
      args:
        WITH_PDF: "1"       # "0" drops Chromium (~400 MB); HTML export still works
    ports:
      - "8080:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in the environment or a .env file}
      # Agent calls per browser session. The keys are yours, so is the bill.
      NAPKIN_AGENT_CAP: ${NAPKIN_AGENT_CAP:-40}
      # Set when you put TLS in front of this.
      # NAPKIN_WEB_SECURE_COOKIE: "1"
    volumes:
      - napkin-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /api/healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  napkin-data:
