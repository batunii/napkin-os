[project]
name = "napkin-layers"
version = "0.1.0"
description = "The knowledge layers on Postgres: schema, migrations and the append rule (napkin.layers/1, foundation-spec S3)."
requires-python = "==3.12.*"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
# pgserver ships a real PostgreSQL 16 (Aurora's major version), so the tests
# run against Postgres itself with nothing installed on the machine.
dev = ["pytest>=8", "pgserver>=0.1.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
