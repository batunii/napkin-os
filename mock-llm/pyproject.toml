[project]
name = "mock-llm"
version = "0.1.0"
description = "A stand-in for the Anthropic Messages API, answered by headless Claude Code. Transport only."
requires-python = ">=3.11"
# Stdlib only. The tests pull the official `anthropic` SDK in with
# `uv run --with anthropic`, so it is never a dependency of the server.
dependencies = []

[project.scripts]
mock-llm = "mock_llm.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mock_llm"]
