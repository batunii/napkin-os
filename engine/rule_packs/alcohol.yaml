id: alcohol
kind: category
name: Alcohol
version: 1
as_of: '2026-10-03'
reviewed: false
applies_when:
  markets: []
  categories: [alcohol]
  topics: []
rules:
- id: alcohol-ie-broadcast-watershed
  markets: [IE]
  media: broadcast
  rule: 'Irish TV: no alcohol ads between 3am and 9pm. Irish radio: on weekdays no alcohol ads from midnight to 10am or from 3pm to midnight.'
  source:
    title: Public Health (Alcohol) Act 2018
    publisher: Irish Statute Book
    url: https://www.irishstatutebook.ie/eli/2018/act/24/enacted/en/print
    section: s.19(1)-(2)
    quote: A person shall not broadcast, or cause to be broadcast, an advertisement for an alcohol product on a television programme service between the hours of 3. 00 a.m. and 9. 00 p.m.
    checked: '2026-10-03'
  note: s.19 commenced 10 January 2025. Commencement checked on the Irish Statute Book Legislation Directory (https://www.irishstatutebook.ie/eli/isbc/2018_24.html, updated to 17 September 2026).
- id: alcohol-ie-outdoor-restricted-places
  markets: [IE]
  media: outdoor
  rule: No alcohol posters or billboards on public transport, at stations or stops, in council parks, or within 200m of schools, early-years services or council playgrounds.
  source:
    title: Public Health (Alcohol) Act 2018
    publisher: Irish Statute Book
    url: https://www.irishstatutebook.ie/eli/2018/act/24/enacted/en/print
    section: s.14(1)
    quote: (h) in or at a school, including the grounds of the school, or within 200 metres of the perimeter of the grounds,
    checked: '2026-10-03'
  note: s.14 commenced 12 November 2019. Commencement checked on the Irish Statute Book Legislation Directory (https://www.irishstatutebook.ie/eli/isbc/2018_24.html, updated to 17 September 2026).
- id: alcohol-ie-cinema
  markets: [IE]
  media: cinema
  rule: In Irish cinemas, alcohol may be advertised only before or in the interval of films certified 18, or in a licensed bar within the cinema.
  source:
    title: Public Health (Alcohol) Act 2018
    publisher: Irish Statute Book
    url: https://www.irishstatutebook.ie/eli/2018/act/24/enacted/en/print
    section: s.20(2)
    quote: (a) immediately before, or during an interval to, the screening of a film that has been certified by the Director of Film Classification as fit for viewing by persons aged 18 years or more,
    checked: '2026-10-03'
  note: s.20 commenced 12 November 2019. Commencement checked on the Irish Statute Book Legislation Directory (https://www.irishstatutebook.ie/eli/isbc/2018_24.html, updated to 17 September 2026).
- id: alcohol-ie-broadcast-no-spirits
  markets: [IE]
  media: broadcast
  rule: Irish broadcasters may not carry ads for drinks of 25% ABV or more (spirits) or for alcopops and pre-mixed spirit drinks; liqueurs under 25% are allowed.
  source:
    title: 'Media Service Code: General Commercial Communications Code (in effect 5 November 2024)'
    publisher: Coimisiún na Meán
    url: https://www.cnam.ie/app/uploads/2025/01/General-Commercial-Communications-Code-v2.pdf
    section: s.18.3
    quote: (a) beverages containing alcohol content of 25% AbV and above e.g. vodka, whiskey, tequila, rum, gin, brandy, etc.; or (b) alco-pops, pre-mixed spirit drinks and products of a similar nature.
    checked: '2026-10-03'
  note: 'Same code s.18.7: only in/around programmes with an adult audience of 75%+, never in/around children''s programmes.'
- id: alcohol-ie-responsibility-message
  markets: [IE]
  media: all
  rule: Irish alcohol ads must include a message to drink responsibly.
  source:
    title: Code of Standards for Advertising and Marketing Communications in Ireland, 7th edition (ASA Code)
    publisher: Advertising Standards Authority (Ireland)
    url: https://adstandards.ie/code/alcoholic-drinks/
    section: s.9.4
    quote: Marketing communications for alcohol should include a responsibility message to drink alcohol responsibly.
    checked: '2026-10-03'
  note: The statutory health warnings for ads (PHAA s.13(2)) and the s.13(7) limits on ad content are NOT commenced (ISB directory, 17 Sept 2026). ASA s.9.12 says drinks campaigns in Irish media should carry Copy Clear approval.
- id: alcohol-ie-over-25
  markets: [IE]
  media: all
  rule: Everyone shown in an Irish alcohol ad must be, and look, over 25.
  source:
    title: Code of Standards for Advertising and Marketing Communications in Ireland, 7th edition (ASA Code)
    publisher: Advertising Standards Authority (Ireland)
    url: https://adstandards.ie/code/alcoholic-drinks/
    section: s.9.7(a)
    quote: Anyone depicted in an alcohol marketing communication should be aged over 25 and should appear to be over 25.
    checked: '2026-10-03'
  note: Narrow exception in 9.7(a)(i) for over-18 ticketed-event images on age-gated owned media.
- id: alcohol-gb-under-25
  markets: [GB]
  media: all
  rule: No one shown drinking or playing a significant role may be, or seem to be, under 25.
  source:
    title: UK Code of Non-broadcast Advertising and Direct & Promotional Marketing (CAP Code)
    publisher: Committee of Advertising Practice / ASA (UK)
    url: https://www.asa.org.uk/type/non_broadcast/code_section/18.html
    section: rule 18.16
    quote: People shown drinking or playing a significant role must neither be nor seem to be under 25.
    checked: '2026-10-03'
  note: BCAP Code rule 19.17 applies the same to TV and radio.
- id: alcohol-gb-no-under-18-appeal
  markets: [GB]
  media: all
  rule: Alcohol ads must not appeal particularly to under-18s, e.g. through youth culture or characters popular with them; no medium with over 25% under-18 audience.
  source:
    title: UK Code of Non-broadcast Advertising and Direct & Promotional Marketing (CAP Code)
    publisher: Committee of Advertising Practice / ASA (UK)
    url: https://www.asa.org.uk/type/non_broadcast/code_section/18.html
    section: rule 18.14 (see also 18.15)
    quote: Marketing communications must not be likely to appeal particularly to people under 18, especially by reflecting or being associated with youth culture.
    checked: '2026-10-03'
  note: TV uses the stricter 'strong appeal' test (BCAP 19.15). BCAP 32.2.1 bars alcohol ads in or next to programmes likely to appeal particularly to under-18s.
- id: alcohol-gb-no-sexual-success
  markets: [GB]
  media: all
  rule: Do not link alcohol with seduction, sexual activity or success, or imply it makes people more attractive.
  source:
    title: UK Code of Non-broadcast Advertising and Direct & Promotional Marketing (CAP Code)
    publisher: Committee of Advertising Practice / ASA (UK)
    url: https://www.asa.org.uk/type/non_broadcast/code_section/18.html
    section: rule 18.5 (see also 18.2-18.7)
    quote: Marketing communications must neither link alcohol with seduction, sexual activity or sexual success nor imply that alcohol can enhance attractiveness.
    checked: '2026-10-03'
  note: BCAP Code rule 19.6 is equivalent (it allows romance or flirtation).
- id: alcohol-ro-spirits-broadcast-hours
  markets: [RO]
  media: broadcast
  rule: 'Romanian broadcast: no advertising of any kind for spirit drinks between 06:00 and 22:00 (gloss).'
  source:
    title: Decizia CNA nr. 573/2025 privind Codul de reglementare a conținutului audiovizual (consolidated to 11.12.2025)
    publisher: Consiliul Național al Audiovizualului (CNA)
    url: https://media.cna.ro/Decizia_CNA_nr_573_2025_Codul_audiovizualului_cu_modificarile_ulterioare_la_data_de_11_12_2025_ab2f6787a8.pdf
    section: Art. 138(1)
    quote: În intervalul orar 6,00 - 22,00 este interzisă orice formă de publicitate la băuturi spirtoase.
    checked: '2026-10-03'
  note: Art. 139 also bans alcohol spots featuring minors.
- id: alcohol-ro-spirits-warning
  markets: [RO]
  media: broadcast
  rule: Romanian ad breaks that promote spirits must end with the spoken and on-screen warning 'Consumul excesiv de alcool dăunează grav sănătății' ('Excessive alcohol consumption seriously harms health').
  source:
    title: Decizia CNA nr. 573/2025 privind Codul de reglementare a conținutului audiovizual (consolidated to 11.12.2025)
    publisher: Consiliul Național al Audiovizualului (CNA)
    url: https://media.cna.ro/Decizia_CNA_nr_573_2025_Codul_audiovizualului_cu_modificarile_ulterioare_la_data_de_11_12_2025_ab2f6787a8.pdf
    section: Art. 141
    quote: 'Calupurile publicitare în care se promovează băuturi spirtoase se vor încheia cu avertismentul sonor și vizual: „Consumul excesiv de alcool dăunează grav sănătății.”'
    checked: '2026-10-03'
  note: The duty attaches to the ad break; confirm with the broadcaster whether the spot itself must carry it.
- id: alcohol-ro-over-25
  markets: [RO]
  media: all
  rule: Romanian alcohol ads must not show anyone drinking unless they are, act and reasonably look over 25; promotional materials must carry a responsible-drinking message.
  source:
    title: Codul de practică în comunicarea comercială (version approved 15 December 2025)
    publisher: Consiliul Român pentru Publicitate (RAC)
    url: https://www.rac.ro/ro/cod/codul-de-practic%C4%82-%C3%8En-comunicarea-comercial%C4%82
    section: Art. 27.4 (see also 27.2 lit. a)
    quote: Comunicarea pentru băuturile alcoolice nu va prezenta persoane consumând alcool dacă acestea nu sunt, acționează și par, în limite rezonabile, a avea vârsta de peste 25 de ani.
    checked: '2026-10-03'
  note: Art. 27.2 lit. a) requires the responsible-consumption message. Romanian statute law on alcohol advertising (Law 148/2000) could not be fetched (anpc.ro bot wall).
